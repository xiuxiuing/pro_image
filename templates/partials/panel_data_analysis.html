<script>
    let statisticsAllItems = [];
    let statisticsFilteredItems = [];
    let statisticsMeta = { main_store: "主店", stores: [] };
    let statisticsTabs = [];
    let statisticsActiveTabId = "main";
    let statisticsPage = 1;
    let statisticsPageSize = 20;
    let statisticsSort = { key: "", order: "desc" };
    let workbenchProjectId = null;
    let workbenchProgressTimer = null;
    let workbenchAnalyzeScope = "partial";

    function syncWorkbenchButton(config) {
        const btn = document.getElementById("statistics-enter-workbench");
        const ready = !!config?.has_links;
        const canReanalyze = ready && getActiveStatisticsTab().source_type === "main";
        if (btn) {
            btn.disabled = false;
            btn.title = ready ? "进入商品明细工作台" : "当前项目还没有关联数据，点击后可先全量分析";
        }
        const reanalyzeBtn = document.getElementById("statistics-reanalyze");
        if (reanalyzeBtn) {
            reanalyzeBtn.disabled = !canReanalyze;
            reanalyzeBtn.title = canReanalyze
                ? "重新分析关联数据"
                : getActiveStatisticsTab().source_type === "main"
                    ? "当前项目还没有关联数据"
                    : "竞店独有类目不支持重新分析";
        }
    }

    function getActiveStatisticsTab() {
        return statisticsTabs.find((tab) => tab.id === statisticsActiveTabId) || statisticsTabs[0] || { id: "main", source_type: "main", source_name: "主店", items: [], totals: {} };
    }

    function renderStatisticsTabs() {
        const root = document.getElementById("statistics-tabs");
        if (!root) return;
        root.innerHTML = statisticsTabs.map((tab) => `
            <button class="statistics-tab ${tab.id === statisticsActiveTabId ? "active" : ""}" type="button" onclick="switchStatisticsTab('${statisticsEscapeHtml(tab.id)}')">
                ${statisticsEscapeHtml(tab.label || tab.source_name || "数据")}
            </button>
        `).join("");
    }

    function switchStatisticsTab(tabId) {
        statisticsActiveTabId = tabId;
        const activeTab = getActiveStatisticsTab();
        statisticsAllItems = (activeTab.items || []).slice();
        const totals = activeTab.totals || {};
        document.getElementById("statistics-total-sales").textContent = statisticsNumber(totals.sales || 0);
        document.getElementById("statistics-total-amount").textContent = statisticsMoney(totals.sales_amount || 0);
        document.getElementById("statistics-total-active-rate").textContent = statisticsPct(totals.active_rate || 0);
        renderStatisticsTabs();
        syncStatisticsSubjectHeaders();
        statisticsPage = 1;
        filterStatistics();
        syncWorkbenchButton(window.__workbenchConfig);
    }

    function syncStatisticsSubjectHeaders() {
        const tab = getActiveStatisticsTab();
        const name = tab.source_type === "main" ? "主店" : (tab.source_name || "竞店");
        document.querySelectorAll(".statistics-subject-head").forEach((el) => {
            el.textContent = name;
        });
        document.querySelectorAll(".statistics-contribution-subject-head").forEach((el) => {
            el.textContent = `${name}贡献`;
        });
    }

    function statisticsNumber(value, digits = 2) {
        const n = Number(value || 0);
        return String(Math.round(n));
    }

    function statisticsMoney(value) {
        return Math.round(Number(value || 0)).toLocaleString('zh-CN');
    }

    function statisticsPct(value) {
        return `${statisticsNumber(value)}%`;
    }

    function statisticsDiffClass(value) {
        const n = Number(value || 0);
        if (n > 0) return "statistics-diff-pos";
        if (n < 0) return "statistics-diff-neg";
        return "";
    }

    function statisticsCell(value, type = "number", diff = false) {
        let text = type === "money" ? statisticsMoney(value) : type === "pct" ? statisticsPct(value) : statisticsNumber(value);
        if (diff && Number(value || 0) > 0) text = `+${text}`;
        const cls = diff ? statisticsDiffClass(value) : "";
        return `<td class="${cls}">${text}</td>`;
    }

    function statisticsEscapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[ch]));
    }

    function toggleStatisticsRow(row) {
        row.classList.toggle("expanded");
        const next = row.nextElementSibling;
        if (next && next.classList.contains("statistics-expand-row")) {
            next.style.display = next.style.display === "table-row" ? "none" : "table-row";
        }
    }

    function closeStatisticsProductModal() {
        document.getElementById("statistics-product-modal").classList.remove("open");
    }

    function renderStatisticsProductRows(items) {
        if (!items.length) {
            return '<div class="statistics-product-empty">该三级类目下暂无销量 ≥ 1 的商品</div>';
        }
        const rows = items.map((item) => {
            const img = statisticsEscapeHtml(item.image || "");
            const imgCell = img
                ? `<img class="statistics-product-img" src="${img}" alt="" loading="lazy" onerror="this.style.display='none'">`
                : "-";
            return `
                <tr>
                    <td>${imgCell}</td>
                    <td class="statistics-product-name">${statisticsEscapeHtml(item.name || "-")}</td>
                    <td>${statisticsEscapeHtml(item.spec || "-")}</td>
                    <td>${statisticsEscapeHtml(item.activity_price || "-")}</td>
                    <td>${statisticsEscapeHtml(item.original_price || "-")}</td>
                    <td>${statisticsEscapeHtml(item.sales || "0")}</td>
                </tr>
            `;
        }).join("");
        return `
            <table class="statistics-product-table">
                <thead>
                    <tr>
                        <th style="width: 86px;">图片</th>
                        <th>商品名称</th>
                        <th style="width: 160px;">规格</th>
                        <th style="width: 110px;">活动价</th>
                        <th style="width: 110px;">原价</th>
                        <th style="width: 90px;">销售</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    async function openStatisticsProductModal(category) {
        const tab = getActiveStatisticsTab();
        const modal = document.getElementById("statistics-product-modal");
        const title = document.getElementById("statistics-product-modal-title");
        const subtitle = document.getElementById("statistics-product-modal-subtitle");
        const body = document.getElementById("statistics-product-modal-body");
        title.textContent = `${category} · 商品详情`;
        subtitle.textContent = `${tab.source_name || tab.label || "当前店铺"} · 销量 ≥ 1 的商品明细`;
        body.innerHTML = '<div class="statistics-product-empty">正在加载商品数据...</div>';
        modal.classList.add("open");

        try {
            const params = new URLSearchParams({
                category,
                source_type: tab.source_type || "main",
                store_id: tab.source_store_id || "",
            });
            const resp = await fetch(`/api/statistics/products?${params.toString()}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            body.innerHTML = renderStatisticsProductRows(data.items || []);
        } catch (err) {
            body.innerHTML = `<div class="statistics-product-empty">商品详情加载失败：${statisticsEscapeHtml(err.message || "未知错误")}</div>`;
        }
    }

    function openProductWorkbench() {
        if (typeof showPanel === "function") {
            showPanel("projects");
        }
    }

    function setWorkbenchMessage(text, isError = false) {
        const el = document.getElementById("workbench-message");
        if (!el) return;
        el.textContent = text || "";
        el.classList.toggle("error", !!isError);
    }

    function setWorkbenchMode(mode) {
        const isManual = mode === "manual";
        document.getElementById("workbench-mode-input").value = isManual ? "manual" : "auto";
        document.getElementById("workbench-mode-auto").classList.toggle("active", !isManual);
        document.getElementById("workbench-mode-manual").classList.toggle("active", isManual);
        document.getElementById("workbench-auto-fields").style.display = isManual ? "none" : "";
        document.getElementById("workbench-manual-fields").style.display = isManual ? "" : "none";
        document.getElementById("workbench-result-file").required = isManual;
        document.getElementById("workbench-submit").textContent = isManual ? "导入关联文件" : "开始分析";
        setWorkbenchMessage("");
    }

    function toggleWorkbenchAiFields() {
        const useAi = document.getElementById("workbench-use-ai").checked;
        document.getElementById("workbench-api-key-group").style.display = useAi ? "" : "none";
        document.getElementById("workbench-ai-model-group").style.display = useAi ? "" : "none";
        document.getElementById("workbench-kimi-key-group").style.display = useAi ? "" : "none";
        document.getElementById("workbench-kimi-model-group").style.display = useAi ? "" : "none";
        document.getElementById("workbench-api-key").required = useAi;
    }

    function buildWorkbenchMatchConfigJson() {
        return JSON.stringify({ category_level: 1 });
    }

    async function loadWorkbenchRuleTemplates() {
        const sel = document.getElementById("workbench-rule-template");
        if (!sel) return;
        try {
            const resp = await fetch("/api/rule-templates");
            const data = await resp.json();
            const items = data.items || [];
            sel.innerHTML = "";
            if (!items.length) {
                sel.innerHTML = '<option value="">(无规则模板)</option>';
                return;
            }
            items.forEach((item) => {
                const opt = document.createElement("option");
                opt.value = item.id;
                opt.textContent = item.name || `#${item.id}`;
                sel.appendChild(opt);
            });
        } catch (err) {
            sel.innerHTML = '<option value="">加载失败</option>';
        }
    }

    async function getWorkbenchConfig(force = false) {
        if (!force && workbenchProjectId && window.__workbenchConfig) return window.__workbenchConfig;
        const resp = await fetch("/api/config");
        if (!resp.ok) throw new Error("无法读取当前项目");
        const config = await resp.json();
            workbenchProjectId = config.project_id;
            if (!workbenchProjectId) throw new Error("当前项目不存在");
            window.__workbenchConfig = config;
            syncWorkbenchButton(config);
            return config;
    }

    async function ensureWorkbenchProjectId() {
        const config = await getWorkbenchConfig();
        return workbenchProjectId;
    }

    async function openWorkbenchAnalyzeModal() {
        try {
            const config = await getWorkbenchConfig(true);
            if (!config.has_links) {
                await openReanalyzeModal({ scope: "full", title: "进入工作台" });
                return;
            }
            storeSources = [];
            currentPage = 1;
            await loadData(true);
            if (typeof showPanel === "function") showPanel("projects");
            return;
        } catch (err) {
            setWorkbenchMessage(err.message || "无法读取当前项目", true);
        }
    }

    function renderWorkbenchCategoryChoices() {
        const list = document.getElementById("workbench-category-list");
        if (!list) return;
        const mainTab = statisticsTabs.find((tab) => tab.source_type === "main") || { items: statisticsAllItems };
        const categories = (mainTab.items || []).map((item) => item.category).filter(Boolean);
        if (!categories.length) {
            list.innerHTML = '<div class="workbench-message">暂无三级类目</div>';
            updateWorkbenchCategorySummary();
            return;
        }
        list.innerHTML = categories.map((cat) => `
            <label class="workbench-category-item">
                <input type="checkbox" class="workbench-category-check" value="${statisticsEscapeHtml(cat)}" checked onchange="updateWorkbenchCategorySummary()">
                <span>${statisticsEscapeHtml(cat)}</span>
            </label>
        `).join("");
        updateWorkbenchCategorySummary();
    }

    function setWorkbenchCategoryChecks(checked) {
        document.querySelectorAll(".workbench-category-check").forEach((el) => {
            el.checked = checked;
        });
        updateWorkbenchCategorySummary();
    }

    function getSelectedWorkbenchCategories() {
        return Array.from(document.querySelectorAll(".workbench-category-check:checked")).map((el) => el.value);
    }

    function updateWorkbenchCategorySummary() {
        const total = document.querySelectorAll(".workbench-category-check").length;
        const selected = getSelectedWorkbenchCategories().length;
        const summary = document.getElementById("workbench-category-summary");
        if (summary) summary.textContent = total ? `已选 ${selected}/${total} 个三级类目` : "暂无可选三级类目";
    }

    function resetWorkbenchAnalyzeForm() {
        const form = document.getElementById("workbench-analyze-form");
        if (form) form.reset();
        document.getElementById("workbench-mode-input").value = "auto";
        document.getElementById("workbench-match-config-json").value = "";
        document.getElementById("workbench-selected-categories").value = "";
        document.getElementById("workbench-preflight-confirmed").value = "0";
        document.getElementById("workbench-column-mappings-json").value = "{}";
        document.getElementById("workbench-progress").classList.remove("open");
        document.getElementById("workbench-progress-fill").style.width = "0%";
        document.getElementById("workbench-progress-summary").textContent = "等待中...";
        document.getElementById("workbench-step-list").innerHTML = "";
        const submit = document.getElementById("workbench-submit");
        if (submit) submit.disabled = false;
        setWorkbenchMode("auto");
        toggleWorkbenchAiFields();
        setWorkbenchMessage("");
    }

    async function openReanalyzeModal(options = {}) {
        workbenchAnalyzeScope = options.scope === "full" ? "full" : "partial";
        const modal = document.getElementById("workbench-modal");
        const title = document.querySelector(".workbench-modal-title");
        if (title) title.textContent = options.title || (workbenchAnalyzeScope === "full" ? "进入工作台" : "重新分析");
        modal.classList.add("open");
        resetWorkbenchAnalyzeForm();
        if (!statisticsAllItems.length) {
            await loadStatistics();
        }
        renderWorkbenchCategoryChoices();
        const scope = document.getElementById("workbench-category-scope");
        if (scope) scope.style.display = workbenchAnalyzeScope === "full" ? "none" : "";
        if (workbenchAnalyzeScope === "full") {
            setWorkbenchCategoryChecks(true);
            document.getElementById("workbench-selected-categories").value = "";
        }
        try {
            await ensureWorkbenchProjectId();
            await loadWorkbenchRuleTemplates();
        } catch (err) {
            setWorkbenchMessage(err.message || "初始化失败", true);
        }
    }

    function closeWorkbenchAnalyzeModal() {
        document.getElementById("workbench-modal").classList.remove("open");
        if (workbenchProgressTimer) {
            clearInterval(workbenchProgressTimer);
            workbenchProgressTimer = null;
        }
    }

    function renderWorkbenchProgress(data) {
        const progress = document.getElementById("workbench-progress");
        const fill = document.getElementById("workbench-progress-fill");
        const summary = document.getElementById("workbench-progress-summary");
        const list = document.getElementById("workbench-step-list");
        progress.classList.add("open");
        fill.style.width = `${data.pct || 0}%`;
        summary.textContent = `分析进度 ${data.done_count || 0}/${data.total_steps || 0} (${data.pct || 0}%)`;
        list.innerHTML = (data.steps || []).map((step) => {
            const state = step.status === "done" ? "完成" : step.status === "running" ? "进行中" : "等待";
            return `<li><span>${step.label || "-"}</span><strong>${state}${step.detail ? " · " + step.detail : ""}</strong></li>`;
        }).join("");
    }

    function buildWorkbenchPreflightMappings(preflight) {
        const mappings = {};
        (preflight.items || []).forEach((item) => {
            const map = {};
            Object.entries(item.mapping || {}).forEach(([field, info]) => {
                if (!info.column && info.suggestions && info.suggestions.length) {
                    map[field] = info.suggestions[0].column;
                }
            });
            if (Object.keys(map).length) mappings[item.key] = map;
        });
        return mappings;
    }

    function summarizeWorkbenchPreflight(preflight) {
        const lines = [];
        (preflight.items || []).forEach((item) => {
            const issues = item.issues || [];
            if (!issues.length) return;
            lines.push(`【${item.label || item.key}】`);
            issues.slice(0, 8).forEach((issue) => lines.push(`- ${issue.message}`));
        });
        const suggested = [];
        (preflight.items || []).forEach((item) => {
            Object.entries(item.mapping || {}).forEach(([field, info]) => {
                if (!info.column && info.suggestions && info.suggestions.length) {
                    suggested.push(`${item.label || item.key}: ${field} → ${info.suggestions[0].column}`);
                }
            });
        });
        if (suggested.length) {
            lines.push("", "建议采用以下列名映射：");
            suggested.slice(0, 12).forEach((line) => lines.push(`- ${line}`));
        }
        return lines.join("\n") || "预检发现风险，是否继续？";
    }

    async function runWorkbenchPreflight(pid, form) {
        const preflightData = new FormData();
        preflightData.append("column_mappings_json", document.getElementById("workbench-column-mappings-json").value || "{}");
        preflightData.append("rule_template_id", form.querySelector('[name="rule_template_id"]')?.value || "");
        const resp = await fetch(`/api/projects/${pid}/preflight`, { method: "POST", body: preflightData });
        const data = await resp.json();
        if (!resp.ok || data.status === "error") throw new Error(data.message || "预检失败");
        const mappings = buildWorkbenchPreflightMappings(data);
        if (Object.keys(mappings).length) {
            document.getElementById("workbench-column-mappings-json").value = JSON.stringify(mappings);
        }
        if (data.level === "block") {
            throw new Error(summarizeWorkbenchPreflight(data));
        }
        if (data.requires_confirmation || data.level === "confirm") {
            const ok = window.confirm(`${summarizeWorkbenchPreflight(data)}\n\n确认继续分析吗？`);
            if (!ok) throw new Error("已取消分析");
            document.getElementById("workbench-preflight-confirmed").value = "1";
        } else {
            document.getElementById("workbench-preflight-confirmed").value = "1";
        }
    }

    async function finishWorkbenchAnalyze() {
        if (workbenchProgressTimer) {
            clearInterval(workbenchProgressTimer);
            workbenchProgressTimer = null;
        }
        setWorkbenchMessage("分析完成，正在进入工作台...");
        storeSources = [];
        currentPage = 1;
        window.__workbenchConfig = null;
        await getWorkbenchConfig(true).catch(() => {});
        await loadStatistics().catch(() => {});
        await loadQualityReport().catch(() => {});
        await loadData(true);
        if (typeof showPanel === "function") showPanel("projects");
        closeWorkbenchAnalyzeModal();
        resetWorkbenchAnalyzeForm();
    }

    async function loadQualityReport() {
        const card = document.getElementById("quality-report-card");
        if (!card) return;
        const cfg = await getWorkbenchConfig(true);
        if (!cfg || !cfg.project_id) return;
        const resp = await fetch(`/api/projects/${cfg.project_id}/quality-report?t=${Date.now()}`);
        if (!resp.ok) {
            card.classList.remove("open", "warn");
            card.textContent = "";
            return;
        }
        const data = await resp.json();
        const summary = data?.report?.summary || {};
        const warnings = data?.report?.warnings || [];
        const downloadRate = Math.round(Number(summary.download_success_rate || 0) * 100);
        const vectorRate = Math.round(Number(summary.vector_success_rate || 0) * 100);
        const bits = [
            `本次分析质量：图片 ${summary.download_success || 0}/${summary.download_total || 0} (${downloadRate}%)`,
            `向量 ${summary.vector_success || 0}/${summary.vector_total || 0} (${vectorRate}%)`,
            `匹配 ${summary.matched || 0}`,
            `规则拦截 ${summary.rule_rejected || 0}`,
        ];
        if (warnings.length) bits.push(`风险 ${warnings.length} 项：${warnings.slice(0, 2).join("；")}`);
        card.textContent = bits.join(" · ");
        card.classList.toggle("warn", warnings.length > 0);
        card.classList.add("open");
    }

    async function pollWorkbenchProgress(pid) {
        try {
            const resp = await fetch(`/api/projects/${pid}/progress`);
            const data = await resp.json();
            if (data.available) {
                renderWorkbenchProgress(data);
                return;
            }
            const projectsResp = await fetch("/api/projects");
            const projects = await projectsResp.json();
            const project = projects.find((item) => item.id === pid);
            const status = project?.status || "ready";
            if (status === "ready") {
                await finishWorkbenchAnalyze();
            } else if (status === "failed") {
                if (workbenchProgressTimer) clearInterval(workbenchProgressTimer);
                workbenchProgressTimer = null;
                setWorkbenchMessage("分析失败，请检查文件或参数后重试", true);
                document.getElementById("workbench-submit").disabled = false;
            }
        } catch (err) {
            setWorkbenchMessage(err.message || "进度读取失败", true);
        }
    }

    function paginateStatistics(items) {
        const total = items.length;
        const pages = Math.max(1, Math.ceil(total / statisticsPageSize));
        statisticsPage = Math.min(Math.max(1, statisticsPage), pages);
        const start = (statisticsPage - 1) * statisticsPageSize;
        return { total, pages, items: items.slice(start, start + statisticsPageSize) };
    }

    function renderStatisticsPagination(total, pages) {
        const root = document.getElementById("statistics-pagination");
        if (!root) return;
        if (total === 0) {
            root.innerHTML = "";
            return;
        }
        const pageButtons = [];
        const start = Math.max(1, statisticsPage - 2);
        const end = Math.min(pages, statisticsPage + 2);
        for (let p = start; p <= end; p++) {
            pageButtons.push(`<button class="statistics-page-btn ${p === statisticsPage ? "is-active" : ""}" type="button" onclick="goStatisticsPage(${p})">${p}</button>`);
        }
        root.innerHTML = `
            <div class="statistics-pagination-main">
                <span>共 ${total} 个三级分类 · 第 ${statisticsPage}/${pages} 页</span>
                <button class="statistics-page-btn" type="button" onclick="goStatisticsPage(${statisticsPage - 1})" ${statisticsPage <= 1 ? "disabled" : ""}>‹</button>
                ${pageButtons.join("")}
                <button class="statistics-page-btn" type="button" onclick="goStatisticsPage(${statisticsPage + 1})" ${statisticsPage >= pages ? "disabled" : ""}>›</button>
                <select class="statistics-page-size" id="statistics-page-size" onchange="changeStatisticsPageSize()">
                    <option value="10" ${statisticsPageSize === 10 ? "selected" : ""}>每页 10 条</option>
                    <option value="20" ${statisticsPageSize === 20 ? "selected" : ""}>每页 20 条</option>
                    <option value="50" ${statisticsPageSize === 50 ? "selected" : ""}>每页 50 条</option>
                    <option value="100" ${statisticsPageSize === 100 ? "selected" : ""}>每页 100 条</option>
                </select>
            </div>
        `;
        syncWorkbenchButton(window.__workbenchConfig);
    }

    function applyStatisticsSort(items) {
        if (!statisticsSort.key) return items;
        const key = statisticsSort.key;
        const dir = statisticsSort.order === "asc" ? 1 : -1;
        return items.slice().sort((a, b) => {
            const av = Number(a?.summary?.[key]?.avg_diff || 0);
            const bv = Number(b?.summary?.[key]?.avg_diff || 0);
            if (av === bv) return String(a.category || "").localeCompare(String(b.category || ""), "zh-CN");
            return (av - bv) * dir;
        });
    }

    function syncStatisticsSortHeaders() {
        document.querySelectorAll(".statistics-sort-head").forEach((el) => {
            const active = el.dataset.sortKey === statisticsSort.key;
            el.classList.toggle("is-active", active);
            el.classList.toggle("asc", active && statisticsSort.order === "asc");
            el.classList.toggle("desc", active && statisticsSort.order === "desc");
        });
    }

    function setStatisticsSort(key) {
        if (statisticsSort.key === key) {
            statisticsSort.order = statisticsSort.order === "desc" ? "asc" : "desc";
        } else {
            statisticsSort = { key, order: "desc" };
        }
        statisticsPage = 1;
        renderStatisticsTable();
    }

    function goStatisticsPage(page) {
        statisticsPage = page;
        renderStatisticsTable();
    }

    function changeStatisticsPageSize() {
        const sel = document.getElementById("statistics-page-size");
        statisticsPageSize = Number(sel?.value || 20);
        statisticsPage = 1;
        renderStatisticsTable();
    }

    function filterStatistics() {
        const q = (document.getElementById("statistics-search")?.value || "").trim().toLowerCase();
        const tabItems = getActiveStatisticsTab().items || [];
        statisticsFilteredItems = q
            ? tabItems.filter((item) => String(item.category || "").toLowerCase().includes(q))
            : tabItems.slice();
        statisticsPage = 1;
        renderStatisticsTable();
    }

    function renderStatistics(data) {
        statisticsMeta = data || { main_store: "主店", stores: [] };
        statisticsTabs = (data.tabs && data.tabs.length ? data.tabs : [{
            id: "main",
            label: data.main_store || "主店",
            source_type: "main",
            source_store_id: "",
            source_name: data.main_store || "主店",
            items: data.items || [],
            totals: data.main_totals || {},
        }]).slice();
        if (!statisticsTabs.some((tab) => tab.id === statisticsActiveTabId)) {
            statisticsActiveTabId = statisticsTabs[0]?.id || "main";
        }
        const activeTab = getActiveStatisticsTab();
        statisticsAllItems = (activeTab.items || []).slice();
        statisticsFilteredItems = statisticsAllItems.slice();
        const totals = activeTab.totals || data.main_totals || {};
        document.getElementById("statistics-total-sales").textContent = statisticsNumber(totals.sales || 0);
        document.getElementById("statistics-total-amount").textContent = statisticsMoney(totals.sales_amount || 0);
        document.getElementById("statistics-total-active-rate").textContent = statisticsPct(totals.active_rate || 0);
        renderStatisticsTabs();
        syncStatisticsSubjectHeaders();
        syncWorkbenchButton(window.__workbenchConfig);
        statisticsPage = 1;
        renderStatisticsTable();
    }

    function renderStatisticsTable() {
        const body = document.getElementById("statistics-body");
        const activeTab = getActiveStatisticsTab();
        const isMainTab = activeTab.source_type === "main";
        const sortedItems = applyStatisticsSort(statisticsFilteredItems);
        const pageData = paginateStatistics(sortedItems);
        const items = pageData.items;
        syncStatisticsSortHeaders();
        renderStatisticsPagination(pageData.total, pageData.pages);
        if (!statisticsAllItems.length) {
            body.innerHTML = '<tr><td colspan="17" class="statistics-empty">当前项目暂无可统计的三级分类数据</td></tr>';
            return;
        }
        if (!items.length) {
            body.innerHTML = '<tr><td colspan="17" class="statistics-empty">没有匹配的三级分类</td></tr>';
            return;
        }

        body.innerHTML = items.map((item, idx) => {
            const s = item.summary || {};
            const competitors = isMainTab ? (item.competitors || []) : [];
            const detailMetricOrder = [
                ["sales", "number"],
                ["sales_amount", "money"],
                ["spu", "number"],
                ["active_rate", "pct"],
                ["category_contribution", "pct"],
            ];
            const detailRows = competitors.length ? competitors.map((c) => {
                const m = c.metrics || {};
                const mainDiff = c.main_diff || c.diff || {};
                const marketDiff = c.market_diff || {};
                const metricCells = detailMetricOrder.map(([key, type]) => `
                    ${statisticsCell(m[key], type)}
                    ${statisticsCell(mainDiff[key], type, true)}
                    ${statisticsCell(marketDiff[key], type, true)}
                `).join("");
                return `
                    <tr>
                        <td class="text-center">${c.store_name || "-"}</td>
                        ${metricCells}
                        <td class="statistics-sub-op"></td>
                    </tr>
                `;
            }).join("") : '<tr><td colspan="17" class="text-center">暂无竞店数据</td></tr>';
            const safeCategory = statisticsEscapeHtml(item.category || "-");
            const categoryCell = isMainTab
                ? `<td class="statistics-category" title="点击展开 ${safeCategory}" onclick="toggleStatisticsRow(this.closest('tr'))">${safeCategory}</td>`
                : `<td class="statistics-category statistics-category-static">${safeCategory}</td>`;
            const actionCell = `<td class="text-center"><button class="statistics-detail-btn" type="button" data-category="${safeCategory}" onclick="openStatisticsProductModal(this.dataset.category)">详情</button></td>`;
            const expandRow = isMainTab ? `
                <tr class="statistics-expand-row" data-statistics-row="${idx}">
                    <td colspan="17">
                        <div class="statistics-expand-content">
                            <table class="statistics-sub-table">
                                <thead>
                                    <tr>
                                        <th class="text-center" style="width: 10%;">竞店明细</th>
                                        <th>单量</th><th>主店差值</th><th>商圈差值</th>
                                        <th>销售额</th><th>主店差值</th><th>商圈差值</th>
                                        <th>SPU数量</th><th>主店差值</th><th>商圈差值</th>
                                        <th>动销率</th><th>主店差值</th><th>商圈差值</th>
                                        <th>类目贡献</th><th>主店差值</th><th>商圈差值</th>
                                        <th class="statistics-sub-op"></th>
                                    </tr>
                                </thead>
                                <tbody>${detailRows}</tbody>
                            </table>
                        </div>
                    </td>
                </tr>
            ` : "";
            return `
                <tr class="statistics-main-row">
                    ${categoryCell}
                    ${statisticsCell(s.sales?.main)}
                    ${statisticsCell(s.sales?.industry_avg, "number", true)}
                    ${statisticsCell(s.sales?.avg_diff, "number", true)}
                    ${statisticsCell(s.sales_amount?.main, "money")}
                    ${statisticsCell(s.sales_amount?.industry_avg, "money", true)}
                    ${statisticsCell(s.sales_amount?.avg_diff, "money", true)}
                    ${statisticsCell(s.spu?.main)}
                    ${statisticsCell(s.spu?.industry_avg, "number", true)}
                    ${statisticsCell(s.spu?.avg_diff, "number", true)}
                    ${statisticsCell(s.active_rate?.main, "pct")}
                    ${statisticsCell(s.active_rate?.industry_avg, "pct", true)}
                    ${statisticsCell(s.active_rate?.avg_diff, "pct", true)}
                    ${statisticsCell(s.category_contribution?.main, "pct")}
                    ${statisticsCell(s.category_contribution?.industry_avg, "pct", true)}
                    ${statisticsCell(s.category_contribution?.avg_diff, "pct", true)}
                    ${actionCell}
                </tr>
                ${expandRow}
            `;
        }).join("");
    }

    async function loadStatistics() {
        const body = document.getElementById("statistics-body");
        const pager = document.getElementById("statistics-pagination");
        if (body) body.innerHTML = '<tr><td colspan="17" class="statistics-empty">正在加载数据分析...</td></tr>';
        if (pager) pager.innerHTML = "";
        try {
            const resp = await fetch("/api/statistics");
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            renderStatistics(await resp.json());
            getWorkbenchConfig(true).catch(() => syncWorkbenchButton({ has_links: false }));
        } catch (err) {
            if (body) body.innerHTML = `<tr><td colspan="17" class="statistics-empty">数据分析加载失败：${err.message}</td></tr>`;
        }
    }

    function exportStatistics() {
        window.location.href = "/api/statistics/export";
    }

    document.getElementById("workbench-analyze-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const submit = document.getElementById("workbench-submit");
        submit.disabled = true;
        setWorkbenchMessage("已提交，正在处理...");
        document.getElementById("workbench-match-config-json").value = buildWorkbenchMatchConfigJson();

        try {
            const pid = await ensureWorkbenchProjectId();
            if (workbenchAnalyzeScope === "full") {
                document.getElementById("workbench-selected-categories").value = "";
            } else {
                const selectedCategories = getSelectedWorkbenchCategories();
                if (!selectedCategories.length) {
                    throw new Error("请至少选择一个三级类目");
                }
                document.getElementById("workbench-selected-categories").value = JSON.stringify(selectedCategories);
            }
            let formData = new FormData(event.target);
            const mode = formData.get("mode") || "auto";
            if (mode === "manual" && !document.getElementById("workbench-result-file").files.length) {
                throw new Error("请上传关联结果文件");
            }
            if (mode === "auto" && document.getElementById("workbench-use-ai").checked && !document.getElementById("workbench-api-key").value.trim()) {
                throw new Error("启用 AI 提取时请填写 Gemini API Key");
            }
            await runWorkbenchPreflight(pid, event.target);
            formData = new FormData(event.target);
            const resp = await fetch(`/api/projects/${pid}/analyze`, { method: "POST", body: formData });
            const data = await resp.json();
            if (!resp.ok || data.status !== "success") {
                throw new Error(data.message || "提交失败");
            }
            if (data.ready) {
                await finishWorkbenchAnalyze();
            } else {
                document.getElementById("workbench-progress").classList.add("open");
                await pollWorkbenchProgress(pid);
                workbenchProgressTimer = setInterval(() => pollWorkbenchProgress(pid), 2000);
            }
        } catch (err) {
            setWorkbenchMessage(err.message || "提交失败", true);
            submit.disabled = false;
        }
    });

    window.addEventListener("DOMContentLoaded", loadStatistics);
    window.addEventListener("DOMContentLoaded", () => loadQualityReport().catch(() => {}));
</script>
