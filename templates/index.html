                    ? `<div class="linked-badge"><img src="https://img.icons8.com/material-outlined/12/ffffff/ok--v1.png"/> 已关联(${linkedCount})</div>`
                    : `<div class="linked-badge" style="background:#64748b;"><img src="https://img.icons8.com/material-outlined/12/ffffff/minus.png"/> 无关联</div>`;
            }

            if (!isMain && isUnlinkedMode && row[`${prefix}__from_pool`]) {
                card.classList.add('unlinked-pool-card');
            }

            let mainTopLeftContent = '';
            let imageContent = '';
            let restOfContent = '';

            const processedFields = new Set();

            // Pre-calculate margins
            const mainPurchPrice = parseFloat(row['采购价']) || 0;
            const mainNewActPrice = parseFloat(row['新活动价']) || 0;

            visibleColumns.forEach(col => {
                if (!isMain && col === '采购价') return; // Competitor cards never display purchase price!
                const val = row[`${prefix}${col}`] || "-";

                if (col === '主图链接') {
                    let imgSrc = getImageSrc(val);
                    imageContent = `<div class="card-top-image" ${isMain ? `onclick="editMainImage('${mainSkuId}', '${imgSrc}')" title="点击修改图片链接"` : ''}>
                    <img src="${imgSrc}" onerror="this.src='${PLACEHOLDER_IMG}'">
                </div>`;
                    return;
                }

                const isTopIdentityField = ['商品条码', '商品名称'].includes(col);

                const isSuggestionField = ['新售价', '新活动价'].includes(col);
                const isSalesField = (col === '销售');

                if (isTopIdentityField) {
                    mainTopLeftContent += `
                <div class="info-group" style="justify-content: flex-start; gap: 8px; border-bottom: none; padding: 0;">
                    <div class="info-label" style="width: 50px; flex-shrink:0;">${col}</div>

        // 修改主店图片链接
        async function editMainImage(mainSkuId, currentUrl) {
            const newUrl = prompt("请输入新的图片链接：", currentUrl !== '-' ? currentUrl : '');
            if (newUrl !== null && newUrl.trim() !== "") {
                const url = newUrl.trim();
                await updateField(mainSkuId, '主图链接', url);
                await updateField(mainSkuId, '图片', url);
                const row = getRowBySku(mainSkuId);
                if (row) {
                    const variants = ['商品图片', '主图', '首图'];
                    for (let v of variants) {
                        if (row[v] !== undefined) {
                            await updateField(mainSkuId, v, url);
                        }
                    }
                }
                refreshSingleRow(mainSkuId);
            }
        }

        async function eliminate(mainSkuId) {
            if (!mainSkuId) return;
            const row = getRowBySku(mainSkuId);
            if (!row) return;
            const next = (isEliminatedRow(row) ? 0 : 1);
            await fetch('/api/eliminate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ main_sku_id: mainSkuId, status: next })
            });
            row['淘汰标记'] = String(next);
            row['是否淘汰'] = (next === 1 ? "是" : "否");
            const handled = (next === 1);
            await fetch('/api/toggle_handled', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ main_sku_id: mainSkuId, handled })
            });
            row['is_handled'] = handled ? '1' : '0';
            await filterData(false);
        }

        async function toggleAdd(storeId, compSkuId) {
            if (!compSkuId) return;
            const prefix = storeId;
            const row = gridData.find(r => String(r[prefix + 'skuId']) === String(compSkuId));
            if (!row) return;
            const currentIsNew = ['是', '新增为SPU', '新增该规格'].includes(row[prefix + '是否新增']);
            const newStatus = !currentIsNew;
            
            try {
                const response = await fetch('/api/toggle_add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ store_id: storeId, is_new: newStatus, sku_id: compSkuId })
                });
                if (response.ok) {
                    const newStatusStr = newStatus ? '是' : '否';
                    const ignoredStatusStr = newStatus ? '否' : null;
                    const affectedSkuIds = [];
                    gridData.forEach(r => {
                        if (String(r[prefix + 'skuId']) === String(compSkuId)) {
                            r[prefix + '是否新增'] = newStatusStr;
                            r[prefix + 'is_new_add'] = newStatusStr;
                            if (ignoredStatusStr !== null) {
                                r[prefix + '是否不处理'] = ignoredStatusStr;
                                r[prefix + 'is_ignored'] = ignoredStatusStr;
                            }
                            if (r.skuId) affectedSkuIds.push(String(r.skuId));
                        }
                    });
                    if (affectedSkuIds.length) affectedSkuIds.forEach(id => refreshSingleRow(id));
                    else renderGrid(false);
                }
            } catch (e) {
                console.error("Toggle add failed:", e);
                alert("操作失败");
            }
        }

        async function toggleIgnore(storeId, compSkuId) {
            if (!compSkuId) return;
            const prefix = storeId;
            const row = gridData.find(r => String(r[prefix + 'skuId']) === String(compSkuId));
            if (!row) return;
            const currentIgnored = row[prefix + '是否不处理'] === '是';
            const newStatus = !currentIgnored;

                    const ignoreStatusStr = newStatus ? '是' : '否';
                    const newAddStatusStr = newStatus ? '否' : null;
                    const affectedSkuIds = [];
                    gridData.forEach(r => {
                        if (String(r[prefix + 'skuId']) === String(compSkuId)) {
                            r[prefix + '是否不处理'] = ignoreStatusStr;

        async function priceMatch(storeId, mainSkuId) {
            if (!mainSkuId) return;
            const row = getRowBySku(mainSkuId);
            if (!row) return;
            const currentStore = String(row['跟价店'] || '').trim();
            const clickedStoreName = (storeSources.find(s => s.id === storeId) || {}).name || '';
            if (currentStore && currentStore === clickedStoreName) {
                await fetch('/api/clear_price_match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ main_sku_id: mainSkuId })
                });
                row['新活动价'] = '';
                row['新售价'] = '';
                row['跟价店'] = '';
                refreshSingleRow(mainSkuId);
            } else {
                const res = await fetch('/api/price_match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ main_sku_id: mainSkuId, store_id: storeId })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    row['新活动价'] = result.new_act;
                    row['新售价'] = result.new_orig;
                    row['跟价店'] = result.store_name;
                    refreshSingleRow(mainSkuId);
                }
            }
        }

        async function updateField(mainSkuId, column, value) {
            if (!mainSkuId) return;
            await fetch('/api/update_cell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ main_sku_id: mainSkuId, column, value })
            });
            const row = getRowBySku(mainSkuId);
            if (row) row[column] = value;
        }

        async function unlinkProduct(storeId, mainSkuId) {
            if (!mainSkuId) return;
            const row = getRowBySku(mainSkuId);
            const storeName = (storeSources.find(s => s.id === storeId) || {}).name || '';
            const matchedPrice = row && storeName && String(row['跟价店'] || '').trim() === storeName;
            const matchedImage = row && row['ref_image_store'] === storeId;
            const matchedName = row && row['ref_name_store'] === storeId;
            const warnings = [];
            if (matchedPrice) warnings.push('跟价');
            if (matchedImage) warnings.push('图片参考');
            if (matchedName) warnings.push('名称参考');
            const msg = warnings.length > 0
                ? `该商品已标记「${storeName}」为${warnings.join('、')}来源，取消关联将同时清除这些标记，确定继续？`
                : '确定要取消关联吗？此操作将清空该列在该行的所有数据。';
            if (!confirm(msg)) return;

            try {
                if (matchedPrice) {
                    await fetch('/api/clear_price_match', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ main_sku_id: mainSkuId })
                    });
                    if (row) { row['新活动价'] = ''; row['新售价'] = ''; row['跟价店'] = ''; }
                }
                if (matchedImage) {
                    await fetch('/api/toggle_ref', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ main_sku_id: mainSkuId, store_id: '', field: 'image' }) });
                    if (row) row['ref_image_store'] = '';
                }
                if (matchedName) {
                    await fetch('/api/toggle_ref', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ main_sku_id: mainSkuId, store_id: '', field: 'name' }) });
                    if (row) row['ref_name_store'] = '';
                }
                const response = await fetch('/api/unlink', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ main_sku_id: mainSkuId, store_id: storeId })
                });
                if (response.ok) {
                    filterData(false);
                }
            } catch (e) {
                console.error("Unlink failed:", e);
                alert("取消关联失败");
            }
        }

        function focusModalSearch() {

        function formatModalSales(product) {
            const raw = product == null
                ? ''
                : (typeof product === 'object' ? (product['销售'] ?? product['销量'] ?? '') : product);
            const text = String(raw ?? '').trim();
            return text === '' ? '—' : text;
        }

        function normalizeSearchText(value) {
            return String(value ?? '').normalize('NFKC').toLowerCase().trim();
        }

        function searchTokens(value, limit = 5) {
            const text = normalizeSearchText(value);
            if (!text) return [];
            const tokens = [];
            const seen = new Set();
            text.split(/[\s,，;；、]+/).forEach(token => {
                if (!token || seen.has(token) || tokens.length >= limit) return;
                seen.add(token);
                tokens.push(token);
            });
            return tokens;
        }

        function productMatchesSearchTokens(product, tokens, fields) {
            if (!tokens || tokens.length === 0) return true;
            const haystack = fields
                .map(field => normalizeSearchText(product?.[field]))
                .filter(Boolean)
                .join(' ');
            return tokens.every(token => haystack.includes(token));
        }

        function updateModalMainStoreSummary(mainSkuId) {
            const box = document.getElementById('modalMainStoreSummary');
            const nameEl = document.getElementById('modalMainStoreName');
            const specEl = document.getElementById('modalMainStoreSpec');
            const skuEl = document.getElementById('modalMainStoreSku');
            const imgEl = document.getElementById('modalMainStoreImage');
            const originalPriceEl = document.getElementById('modalMainStoreOriginalPrice');
            const activityPriceEl = document.getElementById('modalMainStoreActivityPrice');
            const salesEl = document.getElementById('modalMainStoreSales');
            
            const purchMarginWrap = document.getElementById('modalMainStorePurchAndMarginWrap');
            const purchasePriceEl = document.getElementById('modalMainStorePurchasePrice');
            const marginEl = document.getElementById('modalMainStoreMargin');

            if (!box || !nameEl || !specEl || !skuEl || !imgEl) return;
            box.hidden = false;
            
            const titleEl = box.querySelector('.modal-main-store-summary__title');
            if (linkModalMode === 'main_pool') {
                const ctx = poolCompProductContext;
                if (!ctx) {
                    box.hidden = true;
                    return;
                }
                if (purchMarginWrap) {
                    if (ctx.hasAssociation) {
                        purchMarginWrap.style.display = 'flex';
                        const color = ctx.isNegative ? "#ef4444" : "#1e293b";
                        purchMarginWrap.innerHTML = `<span>价格说明</span><span>现价毛利 <b id="modalMainStoreMargin" style="color: ${color}">${ctx.margin || '—'}</b></span>`;
                    } else {
                        purchMarginWrap.style.display = 'none';
                    }
                }
                if (titleEl) titleEl.textContent = ctx.storeName || '竞店';
                nameEl.innerHTML = copyableTextHtml(ctx.name || '—');
                specEl.innerHTML = copyableTextHtml(ctx.spec || '—');
                skuEl.innerHTML = copyableTextHtml(ctx.sku || '—');
                if (originalPriceEl) originalPriceEl.innerHTML = copyableTextHtml(ctx.originalPrice || '—');
                if (activityPriceEl) activityPriceEl.innerHTML = copyableTextHtml(ctx.activityPrice || '—');
                if (salesEl) salesEl.innerHTML = copyableTextHtml(formatModalSales(ctx.sales));
                imgEl.src = getImageSrc(ctx.image || '');
                imgEl.onerror = () => { imgEl.src = PLACEHOLDER_IMG; };
                return;
            }
            if (linkModalMode !== 'store_comp' || !mainSkuId) {
                box.hidden = true;
                return;
            }
            const row = getRowBySku(mainSkuId);
            if (purchMarginWrap) {
                purchMarginWrap.style.display = 'flex';
                let purch = "—";
                let marginText = "—";
                let color = "#1e293b";
                if (row) {
                    purch = row['采购价'] || "—";
                    const actPrice = parseFloat(row['活动价']) || parseFloat(row['原价']) || 0;
                    const purchPrice = parseFloat(row['采购价']) || 0;
                    let isNeg = false;
                    if (actPrice > 0 && purchPrice > 0) {
                        const diff = (actPrice - purchPrice).toFixed(2);
                        const pct = ((actPrice - purchPrice) / actPrice * 100).toFixed(2);
                        marginText = `${diff}（${pct}%）`;
                        isNeg = parseFloat(diff) < 0 || (actPrice > 9.9 && parseFloat(diff) < 5.5);
                    }
                    color = isNeg ? "#ef4444" : "#1e293b";
                }
                purchMarginWrap.innerHTML = `<span>价格说明</span><span>采购价 <b id="modalMainStorePurchasePrice">${purch}</b> ｜ 现价毛利 <b id="modalMainStoreMargin" style="color: ${color}">${marginText}</b></span>`;
            }

            if (titleEl) titleEl.textContent = (typeof mainStoreName === 'string' && mainStoreName.trim()) ? mainStoreName.trim() : '主店';
            nameEl.innerHTML = copyableTextHtml(row ? (row['商品名称'] || '—') : '—');
            specEl.innerHTML = copyableTextHtml(row ? (row['规格名称'] || row['规格名'] || row['规格'] || '—') : '—');
            skuEl.innerHTML = copyableTextHtml(row ? String(row['skuId'] != null && row['skuId'] !== '' ? row['skuId'] : '—') : String(mainSkuId));
            if (originalPriceEl) originalPriceEl.innerHTML = copyableTextHtml(row ? (row['原价'] || '—') : '—');
            if (activityPriceEl) activityPriceEl.innerHTML = copyableTextHtml(row ? (row['活动价'] || '—') : '—');
            if (salesEl) salesEl.innerHTML = copyableTextHtml(row ? formatModalSales(row) : '—');
            imgEl.src = row ? getImageSrc(row['主图链接'] || row['图片']) : PLACEHOLDER_IMG;
            imgEl.onerror = () => { imgEl.src = PLACEHOLDER_IMG; };

        function findPoolCompProductContext(storeId, compSkuId) {
            const sid = String(storeId);
            const sku = String(compSkuId || '').trim();
            const row = (gridData || []).find(r => String(r[`${sid}skuId`] || '').trim() === sku);
            const storeName = (storeSources.find(s => String(s.id) === sid) || {}).name || '竞店';
            if (!row) {
                return { 
                    storeId: sid, 
                    storeName, 
                    sku, 
                    name: '—', 
                    spec: '—', 
                    image: '', 
                    originalPrice: '—', 
                    activityPrice: '—', 
                    sales: '—',
                    purchasePrice: '—',
                    margin: '—',
                    isNegative: false,
                    hasAssociation: false
                };
            }
            
            const purchasePrice = row['采购价'] || '—';
            let marginText = '—';
            let isNegative = false;
            const compAct = parseFloat(row[`${sid}活动价`]) || parseFloat(row[`${sid}原价`]) || 0;
            const mainPurchPrice = parseFloat(row['采购价']) || 0;
            const mainSellPrice = parseFloat(row['活动价']) || parseFloat(row['原价']) || 0;
            if (!isUnlinkedMode && compAct > 0 && mainPurchPrice > 0) {
                const diff = (compAct - mainPurchPrice).toFixed(2);
                const pct = ((compAct - mainPurchPrice) / compAct * 100).toFixed(2);
                marginText = `${diff}（${pct}%）`;
                isNegative = parseFloat(diff) < 0 || (mainSellPrice > 9.9 && parseFloat(diff) < 5.5);
            }
            
            return {
                storeId: sid,
                storeName,
                sku: row[`${sid}skuId`] || sku,
                name: row[`${sid}商品名称`] || '—',
                spec: row[`${sid}规格名称`] || row[`${sid}规格名`] || row[`${sid}规格`] || '—',
                image: row[`${sid}主图链接`] || row[`${sid}图片`] || '',
                originalPrice: row[`${sid}原价`] || '—',
                activityPrice: row[`${sid}活动价`] || '—',
                sales: formatModalSales(row[`${sid}销售`]),
                purchasePrice: purchasePrice,
                margin: marginText,
                isNegative: isNegative,
                hasAssociation: !isUnlinkedMode
            };
        }

        async function openMainLinkModalFromPool(storeId, compSkuId) {
            linkModalMode = "main_pool";
            currentLinkAction = { storeId, compSkuId };

        async function toggleModalLinkedDetails(event, mainSkuId, detailId) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const box = document.getElementById(detailId);
            if (!box || !mainSkuId) return;
            const btn = event?.currentTarget;
            const willOpen = !box.classList.contains('is-open');
            document.querySelectorAll('.modal-linked-details.is-open').forEach(el => {
                if (el !== box) {
                    el.classList.remove('is-open');
                    el.innerHTML = '';
                }
            });
            document.querySelectorAll('.modal-linked-badge.is-open').forEach(el => {
                if (el !== btn) el.classList.remove('is-open');
            });
            if (!willOpen) {
                box.classList.remove('is-open');
                if (btn) btn.classList.remove('is-open');
                return;
            }
            box.classList.add('is-open');
            if (btn) btn.classList.add('is-open');
            if (!linkedDetailsCache[mainSkuId]) {
                box.innerHTML = '<div class="modal-linked-detail-meta">正在加载已关联数据...</div>';
                const res = await fetch(`/api/main_products/${encodeURIComponent(mainSkuId)}/links`);
                if (!res.ok) {
                    box.innerHTML = '<div class="modal-linked-detail-meta">已关联数据加载失败</div>';
                    return;
                }
                linkedDetailsCache[mainSkuId] = await res.json();
            }
            renderModalLinkedDetails(box, linkedDetailsCache[mainSkuId]);
        }

                const price = p['活动价'] || p['单件折扣价'] || p['原价'] || '-';
                const sales = p['销售'] || p['销量'] || '-';
                const similarity = p['__link_similarity'] !== '' && p['__link_similarity'] != null
                    ? `${(parseFloat(p['__link_similarity']) * 100).toFixed(0)}%`
                    : '-';

                            <div class="modal-linked-detail-meta">销量: ${escHtml(sales)} ｜ 类目: ${escHtml(p['美团类目三级'] || '-')} ｜ 相似/方式: ${escHtml(similarity)} / ${escHtml(matchType)}</div>

        function requestLinkFollowOptions() {
            const dialog = document.getElementById('linkFollowDialog');
            const priceRetailEl = document.getElementById('linkFollowPriceRetail');
            const priceActivityEl = document.getElementById('linkFollowPriceActivity');
            const imageEl = document.getElementById('linkFollowImage');
            const nameEl = document.getElementById('linkFollowName');
            const eliminateEl = document.getElementById('linkFollowEliminate');
            const newSpuEl = document.getElementById('linkFollowNewSpu');
            const newSpecEl = document.getElementById('linkFollowNewSpec');
            
            const confirmBtn = document.getElementById('linkFollowConfirm');
            const cancelBtn = document.getElementById('linkFollowCancel');
            if (!dialog || !priceRetailEl || !priceActivityEl || !imageEl || !nameEl || !eliminateEl || !newSpuEl || !newSpecEl || !confirmBtn || !cancelBtn) {
                return Promise.resolve({
                    priceRetail: true,
                    priceActivity: true,
                    image: false,
                    name: false,
                    eliminate: false,
                    newSpu: false,
                    newSpec: false
                });
            }
            
            priceRetailEl.checked = true;
            priceActivityEl.checked = true;
            imageEl.checked = false;
            nameEl.checked = false;
            eliminateEl.checked = false;
            newSpuEl.checked = false;
            newSpecEl.checked = false;
            
            const spuListener = () => {
                if (newSpuEl.checked) newSpecEl.checked = false;
            };
            const specListener = () => {
                if (newSpecEl.checked) newSpuEl.checked = false;
            };
            newSpuEl.addEventListener('change', spuListener);
            newSpecEl.addEventListener('change', specListener);
            
            dialog.classList.add('is-open');
            return new Promise(resolve => {
                const cleanup = () => {
                    confirmBtn.removeEventListener('click', onConfirm);
                    cancelBtn.removeEventListener('click', onCancel);
                    dialog.removeEventListener('click', onBackdrop);
                    newSpuEl.removeEventListener('change', spuListener);
                    newSpecEl.removeEventListener('change', specListener);
                    dialog.classList.remove('is-open');
                };
                const onConfirm = () => {
                    const result = {
                        priceRetail: !!priceRetailEl.checked,
                        priceActivity: !!priceActivityEl.checked,
                        image: !!imageEl.checked,
                        name: !!nameEl.checked,
                        eliminate: !!eliminateEl.checked,
                        newSpu: !!newSpuEl.checked,
                        newSpec: !!newSpecEl.checked
                    };
                    cleanup();
                    resolve(result);
                };
                const onCancel = () => {
                    cleanup();
                    resolve(null);
                };
                const onBackdrop = (event) => {
                    if (event.target === dialog) onCancel();
                };
                confirmBtn.addEventListener('click', onConfirm);
                cancelBtn.addEventListener('click', onCancel);
                dialog.addEventListener('click', onBackdrop);
            });
        }

        async function applyLinkFollowOptions(mainSkuId, storeId, options, compSkuId) {
            if (!mainSkuId || storeId == null || !options) return;
            const tasks = [];
            
            if (options.priceRetail || options.priceActivity) {
                tasks.push(fetch('/api/price_match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        main_sku_id: mainSkuId, 
                        store_id: storeId,
                        match_act: !!options.priceActivity,
                        match_orig: !!options.priceRetail
                    })
                }).then(async res => {
                    if (!res.ok) return null;
                    return res.json();
                }));
            }
            if (options.image) {
                tasks.push(fetch('/api/toggle_ref', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ main_sku_id: mainSkuId, store_id: storeId, field: 'image' })
                }));
            }
            if (options.name) {
                tasks.push(fetch('/api/toggle_ref', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ main_sku_id: mainSkuId, store_id: storeId, field: 'name' })
                }));
            }
            if (options.eliminate) {
                tasks.push(fetch('/api/eliminate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ main_sku_id: mainSkuId, status: 1 })
                }));
                tasks.push(fetch('/api/toggle_handled', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ main_sku_id: mainSkuId, handled: true })
                }));
            }
            if (compSkuId) {
                let isNewVal = '否';
                if (options.newSpu) isNewVal = '新增为SPU';
                else if (options.newSpec) isNewVal = '新增该规格';
                
                tasks.push(fetch('/api/toggle_add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ store_id: storeId, sku_id: compSkuId, is_new: isNewVal })
                }));
            }
            
            const results = await Promise.all(tasks);
            const row = getRowBySku(mainSkuId);
            if (!row) return;
            
            if (options.priceRetail || options.priceActivity) {
                const priceResult = results.find(r => r && r.status === 'success');
                if (priceResult) {
                    if (options.priceActivity && priceResult.new_act !== undefined) {
                        row['新活动价'] = priceResult.new_act;
                    }
                    if (options.priceRetail && priceResult.new_orig !== undefined) {
                        row['新售价'] = priceResult.new_orig;
                    }
                    row['跟价店'] = priceResult.store_name;
                }
            }
            if (options.image) row['ref_image_store'] = String(storeId);
            if (options.name) row['ref_name_store'] = String(storeId);
            if (options.eliminate) {
                row['淘汰标记'] = '1';
                row['是否淘汰'] = '是';
                row['is_handled'] = '1';
            }
            if (compSkuId) {
                const prefix = storeId;
                let isNewVal = '否';
                if (options.newSpu) isNewVal = '新增为SPU';
                else if (options.newSpec) isNewVal = '新增该规格';
                gridData.forEach(r => {
                    if (String(r[prefix + 'skuId']) === String(compSkuId)) {
                        r[prefix + '是否新增'] = isNewVal;
                        r[prefix + 'is_new_add'] = isNewVal;
                        if (isNewVal !== '否') {
                            r[prefix + '是否不处理'] = '否';
                            r[prefix + 'is_ignored'] = '否';
                        }
                    }
                });
            }
        }

        async function performLinkFromPoolWithMain(mainProduct) {

        function setExportBusy(isBusy) {
            const btn = document.getElementById('exportBtn');
            const menuItems = document.querySelectorAll('.export-menu-item');
            if (!btn) return;
            if (!btn.dataset.originalHtml) btn.dataset.originalHtml = btn.innerHTML;
            btn.disabled = isBusy;
            btn.innerHTML = isBusy ? '<span class="spinner-small"></span> 正在生成...' : btn.dataset.originalHtml;
            menuItems.forEach(item => { item.disabled = isBusy; });
        }

        async function downloadExport(endpoint, fallbackFilename) {
            closeExportMenu();
            setExportBusy(true);

            try {
                const response = await fetch(endpoint + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Download failed');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;

                // Try to get filename from header
                let filename = fallbackFilename;
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.indexOf('attachment') !== -1) {
                    const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                    const matches = filenameRegex.exec(disposition);
                    if (matches != null && matches[1]) {
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (err) {
                console.error(err);
                alert("下载失败，请稍后重试。");
            } finally {
                setExportBusy(false);
            }
        }

        // Image Zoom Logic
        function initImagePreview() {
            const overlay = document.getElementById('image-zoom-overlay');
            const zoomImg = document.getElementById('zoom-img');
            
            const zoomImgSelector = '.card-top-image img, .product-list-img img, .modal-thumb-zoom img';

            document.addEventListener('mouseover', e => {
                const img = e.target.closest(zoomImgSelector);
                if (img) {
                    zoomImg.src = img.src;
                    overlay.style.display = 'block';
                    updateZoomPos(e);
                }
            });

            document.addEventListener('mousemove', e => {
                if (overlay.style.display === 'block') updateZoomPos(e);
            });

            document.addEventListener('mouseout', e => {
                if (e.target.closest(zoomImgSelector)) {
                    overlay.style.display = 'none';
                }
            });
        }

        function updateZoomPos(event) {
            const overlay = document.getElementById('image-zoom-overlay');
            let x = event.clientX + 20, y = event.clientY - 175;
            const winW = window.innerWidth, winH = window.innerHeight;
            if (x + 350 > winW) x = event.clientX - 370;
            if (y < 10) y = 10;
            if (y + 350 > winH) y = winH - 360;
            overlay.style.left = x + 'px'; overlay.style.top = y + 'px';
        }

        function initPanelSwitcher() {
            function showPanel(name) {
                const map = { data: 'panel-data', projects: 'panel-projects', strategy: 'panel-strategy' };
                const wantId = map[name];
                if (!wantId) return;
                document.querySelectorAll('.app-panel').forEach((p) => {
                    p.classList.toggle('is-active', p.id === wantId);
                });
                if (name === 'projects' && !window.__workbenchLoaded) {
                    loadData(true);
                }
            }
            window.showPanel = showPanel;
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPanelSwitcher();
            setupCopyFieldDelegation();
            initImagePreview();

            const globalSearch = document.getElementById('globalSearch');
            if (globalSearch) {
                globalSearch.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {

                    }
                });
            }
            const modalSearch = document.getElementById('modalSearch');
            if (modalSearch) {
                const debouncedModalSearch = debounce(() => renderModalList(), 300);
                modalSearch.addEventListener('input', debouncedModalSearch);
                modalSearch.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        renderModalList();
                    }
                });
