<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>商品竞对分析平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 
         * --- 设计系统与变量定义 ---
         * 包含全局颜色、间距、圆角以及阴影定义
         */
        :root {
            --bg-color: #f8fafc;
            --min-card-width: 220px;
            --card-gap: 16px;
            --primary-color: #6366f1;
            /* Indigo */
            --primary-hover: #4f46e5;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.3);
            --card-main-bg: #e0e7ff;
            --card-comp-bg: #fffbeb;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)), url('/static/bg_meituan.jpg') center/cover no-repeat fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Styles */
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            z-index: 100;
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #0f172a 0%, #4338ca 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .header-slogan {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            border: 1px solid #e2e8f0;
            background: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            border-color: #cbd5e1;
            transform: translateY(-1.5px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary, .btn-unlinked {
            color: #fff;
            border: none;
        }

        .btn-primary { background: var(--primary-color); }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-unlinked { background: #6366f1; }
        .btn-unlinked:hover { background: #4f46e5; }
        .btn-unlinked.active {
            background: #60a5fa;
        }
        .btn-unlinked.active:hover {
            background: #3b82f6;
        }

        .export-menu-wrap {
            position: relative;
        }

        .export-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 188px;
            padding: 8px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.14);
            z-index: 240;
            animation: slideDown 0.16s ease-out;
        }

        .export-menu.show {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .export-menu-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .export-menu-item:hover {
            background: #f8fafc;
            color: var(--primary-color);
        }

        .export-menu-item:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .export-menu-item svg {
            width: 18px;
            height: 18px;
            color: #64748b;
            flex: 0 0 auto;
        }

        .btn-primary img {
             filter: brightness(0) invert(1);
        }
        .btn-unlinked svg {
            vertical-align: middle;
            margin-right: 2px;
        }

        /* ---------------------------------------------------------
         * --- 布局组件样式 (容器, 滚动条, 表头等) ---
         * --------------------------------------------------------- */

        /* 主体布局容器 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Scrollable Area */
        .product-scroller {
            flex: 1;
            overflow-x: auto;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 0 16px 12px 16px; /* No top padding to keep sticky header flush */
        }

        /* Header Row with Store Tabs */
        .store-header-row {
            display: grid;
            grid-template-columns: repeat(var(--col-count, 4), 1fr);
            gap: var(--card-gap);
            min-width: calc(var(--min-card-width) * var(--col-count, 4));
            position: sticky;
            top: -1px; /* Slight overlap to avoid hairline gaps */
            z-index: 50;
            padding: 16px 16px 16px 16px;
            background: rgba(248, 250, 252, 0.98);
            margin: 0 -16px 8px; /* Offset the 16px scroller padding */
            border-bottom: 2px solid rgba(0, 0, 0, 0.03);
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.05); /* Added slight shadow depth */
        }

        .store-tab {
            width: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            min-width: 0;
            border-radius: var(--radius-md);
            padding: 8px 12px;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.96);
            position: relative;
            overflow: hidden;
        }

        .store-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--store-accent, #e2e8f0);
        }

        .tab-main {
            border-color: #e2e8f0;
        }

        .tab-comp {
            border-color: #e2e8f0;
        }

        .store-tab-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .store-tab-counts {
            display: inline-flex;
            gap: 16px;
            align-items: center;
            margin-left: 8px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .store-tab-counts span {
            display: inline-flex;
            gap: 4px;
        }

        /* Row Layout */
        .products-row {
            display: grid;
            grid-template-columns: repeat(var(--col-count, 4), 1fr);
            gap: var(--card-gap);
            min-width: calc(var(--min-card-width) * var(--col-count, 4));
            padding: 0 16px;
            margin: 0 -16px 16px;
            animation: slideUp 0.3s ease-out backwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Product Card */
        .product-card {
            width: 100%;
            flex-shrink: 0;
            background: #fff;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            border: 1px solid #f1f5f9;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            position: relative;
            transition: all 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .main-card {
            background: var(--card-main-bg);
            border-color: #dbeafe;
        }

        .comp-card {
            border-color: #fef3c7;
        }

        .empty-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1.5px dashed #e2e8f0;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            min-height: 300px;
        }

        .manual-select-card-btn {
            min-width: 148px;
            min-height: 92px;
            padding: 12px 24px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #8a95a6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .manual-select-card-btn:hover {
            background: rgba(255, 255, 255, 0.38);
            color: #64748b;
            transform: translateY(-1px);
        }

        .manual-select-plus {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 200;
            line-height: 1;
        }

        .card-image {
            height: 120px;
            background: rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            padding: 8px;
            position: relative;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-top-image {
            width: 128px;
            height: 128px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .card-top-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #image-zoom-overlay {
            position: fixed;
            display: none;
            width: 350px;
            height: 350px;
            z-index: 10000;
            background: #fff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px;
            pointer-events: none;
            overflow: hidden;
        }

        #image-zoom-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-info {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-group {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 4px;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.05);
        }

        .info-group:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
            width: 60px;
        }

        .info-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            flex: 1;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-spec {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: right;
            flex: 1;
        }

        .info-prices {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex: 1;
        }

        .price-act {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .info-stats {
            font-size: 11px;
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
            flex: 1;
        }

        .copyable-field-value {
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
            display: inline-block;
            max-width: 100%;
            vertical-align: top;
            word-break: break-word;
        }

        .copyable-field-value:hover {
            background: rgba(99, 102, 241, 0.12);
        }

        .copyable-field-value::after {
            content: '点击复制';
            position: absolute;
            left: 0;
            top: 100%;
            margin-top: 4px;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            background: #334155;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .copyable-field-value:hover::after {
            opacity: 1;
            transform: translateY(0);
        }

        .highlight-sales {
            color: #fff !important;
            background: #ef4444 !important;
            padding: 2px 8px !important;
            border-radius: 4px !important;
            font-size: 16px !important;
            font-weight: 900 !important;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
            display: inline-block;
        }

        .card-actions {
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: rgba(0, 0, 0, 0.03);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 竞店底栏：轻量图标工具条（主店底栏不变） */
        .comp-card .card-actions {
            justify-content: space-around;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 18px;
            gap: 12px;
            flex-wrap: nowrap;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid #edf2f7;
        }

        .comp-card .card-actions-group {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 12px;
            min-width: 0;
            width: 100%;
        }

        .comp-card .card-actions-group.right {
            margin-left: 0;
        }

        .action-btn {
            background: #fff;
            color: var(--primary-color);
            border: 1.5px solid var(--primary-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }

        .ref-icon-btn {
            width: 32px;
            height: 32px;
            min-width: 32px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease;
            padding: 0;
            line-height: 1;
        }

        .ref-icon-btn svg {
            width: 24px;
            height: 24px;
            stroke-width: 1.8;
        }

        .ref-icon-btn.ref-btn-image {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-image:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-icon-btn.ref-active-image {
            background: #eef2ff !important;
            color: #6366f1 !important;
        }
        .ref-icon-btn.ref-btn-name {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-name:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-icon-btn.ref-active-name {
            background: #eef2ff !important;
            color: #6366f1 !important;
        }
        .ref-icon-btn.ref-btn-unlink {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-unlink:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-icon-btn.ref-btn-calibrate {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-calibrate:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-icon-btn.ref-btn-calibrate.ref-btn-calibrate-text {
            width: auto;
            min-width: auto;
            padding: 0 8px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .ref-icon-btn.ref-btn-pricematch {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-pricematch:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-icon-btn.ref-active-pricematch {
            background: #ecfdf5 !important;
            color: #059669 !important;
        }
        .ref-icon-btn.ref-btn-add {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-add:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-icon-btn.ref-active-add {
            background: #ecfdf5 !important;
            color: #16a34a !important;
        }
        .ref-icon-btn.ref-btn-ignore {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-ignore:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-icon-btn.ref-active-ignore {
            background: #f1f5f9 !important;
            color: #475569 !important;
        }
        .ref-icon-btn.ref-btn-link-pool {
            background: transparent;
            color: #94a3b8;
        }
        .ref-icon-btn.ref-btn-link-pool:hover {
            background: #f8fafc;
            color: #64748b;
        }
        .ref-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            cursor: default;
            white-space: nowrap;
        }
        .ref-tag-image {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #fed7aa;
        }
        .ref-tag-name {
            background: #f5f3ff;
            color: #7c3aed;
            border: 1px solid #ddd6fe;
        }
        .ref-tag .ref-tag-close {
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            opacity: 0.6;
            margin-left: 2px;
        }
        .ref-tag .ref-tag-close:hover {
            opacity: 1;
        }

        /* 主店已关联角标不拦截点击，避免「已处理」/底栏在部分布局下点不动 */
        .product-card .linked-badge {
            pointer-events: none;
        }
        /* 底栏常用按钮在 flex 子项拉长时保证在可点层，避免与 card-info 叠放异常 */
        .product-card .card-actions {
            position: relative;
            z-index: 2;
        }

        .btn-eliminate {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .btn-eliminate:hover {
            background: var(--danger-color);
            color: #fff;
        }

        /* Editable Input Styles */
        .editable-price {
            width: 80px;
            padding: 4px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-color);
            background: #fff;
            text-align: right;
        }

        .editable-price:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Status Badge Styles - Professional Stamp */
        .status-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            user-select: none;
            opacity: 0.85;
            animation: badgeFadeIn 0.6s cubic-bezier(0.23, 1, 0.32, 1) backwards;
        }

        .status-badge .stamp-inner {
            position: absolute;
            inset: 0;
            border: 2px solid currentColor;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-badge .stamp-inner::after {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid currentColor;
            border-radius: 50%;
        }

        .status-badge .stamp-text {
            background: #fff;
            border: 2px solid currentColor;
            padding: 3px 8px;
            font-size: 13px;
            font-weight: 900;
            color: currentColor;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            box-shadow: 0 0 0 3px #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes badgeFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(-45deg) scale(1.8);
            }

            to {
                opacity: 0.85;
                transform: translate(-50%, -50%) rotate(-15deg) scale(1);
            }
        }

        .badge-eliminated {
            color: #ef4444;
        }

        .badge-new {
            color: #10b981;
        }

        .badge-ignore {
            color: #64748b;
        }

        .eliminated {
            opacity: 0.6;
            filter: grayscale(0.8);
        }

        .main-card.eliminated {
            border: 3px solid #ef4444 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12), var(--shadow-md) !important;
        }

        .inline-status-flag {

            top: 10px;
            left: 10px;
            z-index: 120;

            color: #fff;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);

        .match-explain-btn {
            border: 1px solid #fed7aa;
            background: #fff7ed;
            color: #c2410c;
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            flex: 0 0 auto;

        .match-explain-btn:hover {
            background: #ffedd5;
            border-color: #fdba74;
        }

        .explain-modal-content {
            max-width: 760px;
        }

        .explain-body {
            padding: 18px 22px 22px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .explain-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .explain-summary-item,
        .explain-section {
            border: 1px solid #e2e8f0;
            background: #fff;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .explain-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .explain-value {
            font-size: 13px;
            color: #0f172a;
            font-weight: 800;
            word-break: break-word;
        }

        .explain-section-title {
            font-size: 13px;
            color: #334155;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .explain-metric {
            display: grid;
            grid-template-columns: 92px 64px 1fr;
            gap: 8px;
            align-items: start;
            padding: 8px 0;
            border-top: 1px solid #f1f5f9;
            font-size: 12px;
        }

        .explain-metric:first-of-type {
            border-top: 0;
        }

        .explain-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 46px;
            height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
        }

        .explain-pill.pass { background: #dcfce7; color: #166534; }
        .explain-pill.fail { background: #fee2e2; color: #b91c1c; }
        .explain-pill.off { background: #f1f5f9; color: #64748b; }
        .explain-pill.weak { background: #eef2ff; color: #4338ca; }
        .explain-pill.skip { background: #fef3c7; color: #92400e; }

        .explain-detail {
            color: #475569;
            line-height: 1.45;
            word-break: break-word;
        }

        .explain-candidate {
            border-top: 1px solid #f1f5f9;
            padding: 10px 0;
        }

        .explain-candidate:first-of-type {
            border-top: 0;
            padding-top: 0;
        }

        .explain-candidate-head {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: start;
        }

        .explain-candidate-name {
            color: #0f172a;
            font-size: 13px;
            font-weight: 900;
            line-height: 1.45;
            word-break: break-word;
        }

        .explain-candidate-meta {
            color: #64748b;
            font-size: 12px;
            line-height: 1.45;
            margin-top: 4px;
        }

        .explain-candidate details {
            margin-top: 8px;
        }

        .explain-candidate summary {
            cursor: pointer;
            color: #2563eb;
            font-size: 12px;
            font-weight: 800;
            user-select: none;
        }

        @media (max-width: 720px) {
            .explain-summary { grid-template-columns: 1fr; }
            .explain-metric { grid-template-columns: 78px 56px 1fr; }
            .explain-candidate-head { grid-template-columns: 1fr; }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .modal-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 24px;
        }

        .modal-body > .search-box {
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        /* 手动关联竞店：搜索框下方固定展示当前主店 SKU，仅列表区域滚动 */
        .modal-main-store-summary {
            flex-shrink: 0;
            margin-bottom: 12px;
            padding: 12px 14px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.45;
        }

        .modal-main-store-summary__inner {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .modal-main-store-summary__body {
            flex: 1;
            min-width: 0;
        }

        .modal-main-store-summary[hidden] {
            display: none !important;
        }

        .modal-main-store-summary__title {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        .modal-main-store-summary__name {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-word;
        }

        .modal-main-store-summary__meta {
            font-size: 12px;
            color: #64748b;
        }

        .modal-main-store-summary__meta + .modal-main-store-summary__meta {
            margin-top: 4px;
        }

        .modal-main-store-summary__meta span:first-child {
            color: #94a3b8;
            margin-right: 6px;
        }

        .modal-list-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Filter Popup */
        .filter-popup {
            display: none;
            position: absolute;
            top: 55px;
            right: 0;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 200;
            width: 420px;
            padding: 16px;
            animation: slideDown 0.2s ease-out;
            max-height: 80vh;
            flex-direction: column;
        }

        .filter-list-header {
            display: flex;
            justify-content: space-between;
            padding: 0 4px 10px 4px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            transition: background 0.2s;
            border-top: 1px solid transparent;
            /* Placeholder for drag visual */
            margin-bottom: 2px;
            background: #fff;
        }

        .sort-mini-btn {
            background: #f1f5f9;
            border: none;
            border-radius: 4px;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sort-mini-btn:hover {
            background: #e2e8f0;
            color: var(--primary-color);
        }

        .sort-mini-btn.active {
            background: var(--primary-color);
            color: #fff;
        }

        .filter-item:hover {
            background: #f1f5f9;
        }

        .filter-item.dragging {
            opacity: 0.4;
            background: #e2e8f0;
        }

        .filter-input-small {
            width: 80px;
            padding: 4px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
        }

        .filter-input-small:focus {
            border-color: var(--primary-color);
        }

        .product-list-item {
            display: flex;
            gap: 20px;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid transparent;
        }

        .product-list-item:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary-color);
        }

        .product-list-item.main-product-choice {

        }

        .modal-product-row {

        }

        .modal-linked-badge {
            display: inline-flex;
            align-items: center;
            background: #10b981;

            font-weight: 700;

        .modal-linked-details {

        .modal-linked-detail-item {

            gap: 12px;

        }

        }

        .modal-linked-detail-store {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;

            background: #eef2ff;

        }

        .modal-linked-detail-price {

        .link-follow-dialog {
            position: fixed;
            inset: 0;
            display: none;

            justify-content: center;
            z-index: 3000;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(3px);
        }

        .link-follow-dialog.is-open {
            display: flex;
        }

        .link-follow-box {
            width: min(560px, calc(100vw - 40px));
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
            padding: 24px;
        }

        .link-follow-title {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
        }

        .link-follow-subtitle {
            margin: 0 0 16px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        .link-follow-columns {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .link-follow-column {
            flex: 1;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            background: #f8fafc;
        }

        .link-follow-column-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin: 0 0 12px 0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .link-follow-column-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-follow-option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;

        .link-follow-option-item:hover {
            border-color: var(--primary-color);
            background: #f5f3ff;
        }

        .link-follow-option-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .link-follow-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .product-list-img {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            background: #fff;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .product-list-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 关联弹窗内缩略图：尺寸保持 75×75，与主列表一样支持悬浮放大 */
        .modal-thumb-zoom {
            width: 75px;
            height: 75px;

            margin-right: 12px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #f1f5f9;
            cursor: pointer;
        }

        .modal-thumb-zoom img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-list-details {
            flex: 1;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
        }

        .modal-product-price {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 16px;
        }

        .modal-product-label {
            color: #9ca3af;
            font-size: 10px;
            text-transform: uppercase;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Image Preview Overlay */
        #imagePreview {
            position: fixed;
            width: 500px;
            height: 500px;
            background: #fff;
            border: 2px solid #e2e8f0;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 9999;
            pointer-events: none;
            border-radius: 12px;
            overflow: hidden;
        }

        #imagePreview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
        }

        /* 竞店多列对比时：本行销量最高（不抢眼） */
        .comp-sales-highest {
            display: inline-block;
            margin-left: 6px;
            font-size: 10px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.04em;
            vertical-align: 1px;
        }

        .info-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            gap: 4px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 14px;
            color: var(--text-muted);

            height: 36px;

            align-items: center;

            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;

            transition: all 0.2s;
            color: var(--text-main);

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            background: #fff;

        .page-size-selector:focus {

            align-items: center;
            gap: 6px;
            margin-left: 12px;

        .page-jump-wrap .page-jump-label {

            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;

            height: 36px;
            padding: 0 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            outline: none;
            background: #fff;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .page-jump-input:focus {

        }

        .search-wrapper {

            display: flex;
            align-items: center;

            right: 10px;
            cursor: pointer;

            font-size: 20px;
            line-height: 1;
            user-select: none;
            transition: color 0.2s;
        }

        #searchClearBtn:hover {
            color: var(--danger-color);
        }

        .linked-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #10b981;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
            z-index: 10;

            align-items: center;

        .product-card.unlinked-pool-card {

        }

        .app-shell {

            min-height: 0;

<body>

    <script>
        /* 
         * ---------------------------------------------------------
         * --- 全局变量与核心状态管理 ---
         * ---------------------------------------------------------
         */
        let gridData = [];              // 原始全量数据
        let filteredData = [];          // 过滤/排序后的展示数据
        let storeSources = [];          // 竞店配置信息
        let mainStoreName = "主店";       // 主店名称 (Target)
        let currentLinkAction = null;    // 当前正在进行的关联操作上下文
        let allStoreProducts = {};       // 缓存各竞店的商品列表 (用于人工校准弹窗)
        let allBaseColumns = [];         // 数据中的所有可用字段名（不含行内元数据键，见 internalKeys）
        let visibleColumns = [];         // 当前用户选择展示的字段名
        let advancedFilters = {};        // 高级筛选条件 (字段: 关键字)
        let currentSort = { field: null, order: null }; // 当前排序状态
        let showNegativeSalesOnly = false; // 是否只显示负销量 (竞店销量 > 主店销量)
        let showNoLinkOnly = false;        // 是否只显示无关联商品
        let showUnhandledOnly = false;     // 是否只显示未处理商品
        let currentPage = 1;             // 当前页码
        let pageSize = 50;               // 每页显示条数
        let totalItems = 0;
        let totalPages = 0;
        let spuCount = 0;
        let skuCount = 0;
        let storeStats = {};
        let spuEliminatedCount = 0;
        let skuEliminatedCount = 0;
        let currentFilterMode = 'all'; 
        let isUnlinkedMode = false;      // 是否处于“未关联数据池”模式
        let linkModalMode = "store_comp"; // store_comp | main_pool
        let mainProductsCache = [];
        let linkedDetailsCache = {};
        let poolCompProductContext = null;

        const PLACEHOLDER_IMG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

        function debounce(fn, ms) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), ms);
            };
        }

        function getImageSrc(val) {
            if (!val || val === '-' || val === "" || val === "nan") return PLACEHOLDER_IMG;
            if (val.startsWith('http')) return val;
            return '/img/' + val;
        }

        /* 
         * --- 数据初始化与加载 ---
         */
        async function loadData(resetPage = true) {
            if (resetPage) currentPage = 1;
            const loadingMsg = document.getElementById('loadingMsg');
            if (loadingMsg) {
                loadingMsg.style.display = 'block';
                loadingMsg.innerText = "数据载入中，请稍候...";
            }

            try {
                if (!storeSources || storeSources.length === 0) {
                    const configRes = await fetch('/api/config');
                    const config = await configRes.json();
                    storeSources = config.stores;
                    mainStoreName = config.main_store;
                }

                const searchInput = document.getElementById('globalSearch');
                const searchVal = searchInput ? searchInput.value.trim() : "";
                
                const filtersPayload = {};
                Object.keys(advancedFilters).forEach(k => {
                    const v = (advancedFilters[k] || '').trim();
                    if (v) filtersPayload[k] = v;
                });
                const sortField = currentSort.field || '';
                const sortOrder = currentSort.order || 'desc';
                const neg = showNegativeSalesOnly ? '1' : '0';
                let url = `/api/grid_data?page=${currentPage}&limit=${pageSize}&search=${encodeURIComponent(searchVal)}&mode=${currentFilterMode}`;
                url += `&filters=${encodeURIComponent(JSON.stringify(filtersPayload))}`;
                url += `&sort_field=${encodeURIComponent(sortField)}&sort_order=${encodeURIComponent(sortOrder)}`;
                url += `&negative_sales=${neg}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                gridData = data.items;
                filteredData = data.items;
                totalItems = data.total;
                totalPages = data.pages;
                spuCount = data.spu_count || 0;
                skuCount = data.sku_count ?? data.total ?? 0;
                storeStats = data.store_stats || {};
                spuEliminatedCount = data.spu_eliminated_count || 0;
                skuEliminatedCount = data.sku_eliminated_count || 0;

                const hasActiveFilters = Object.keys(filtersPayload).length > 0 || currentFilterMode !== 'all' || showNegativeSalesOnly;
                if (totalItems === 0 && !searchVal && !hasActiveFilters) {
                    if (loadingMsg) loadingMsg.innerText = "当前项目未包含分析结果。";
                    return;
                }

                if (loadingMsg) loadingMsg.style.display = 'none';

                extractHeaders();
                renderGrid(false);
                renderPagination(totalItems, totalPages);
                renderFilterPopup();
                window.__workbenchLoaded = true;
            } catch (e) {
                console.error("Failed to load data:", e);
                if (loadingMsg) {
                    loadingMsg.style.color = "red";
                    loadingMsg.innerText = `数据加载失败: ${e.message}`;
                }
            }
        }

        async function loadUnlinkedData(resetPage = true) {
            if (resetPage) currentPage = 1;
            const loadingMsg = document.getElementById('loadingMsg');
            if (loadingMsg) {
                loadingMsg.style.display = 'block';
                loadingMsg.innerText = "正在加载未匹配数据...";
            }
            try {
                if (!storeSources || storeSources.length === 0) {
                    const configRes = await fetch('/api/config');
                    const config = await configRes.json();
                    storeSources = config.stores;
                    mainStoreName = config.main_store;
                }
                const searchVal = (document.getElementById('globalSearch')?.value || "").trim();
                const categoryVal = (advancedFilters['美团类目三级'] || "").trim();
                const sortOrder = currentSort.order || 'desc';
                const mSort = /^(\d+)销售$/.exec(currentSort.field || '');
                const sortStoreIdForApi = mSort ? mSort[1] : '';
                const filtersPayload = {};
                Object.keys(advancedFilters).forEach(k => {
                    const v = (advancedFilters[k] || '').trim();
                    if (v) filtersPayload[k] = v;
                });
                const neg = showNegativeSalesOnly ? '1' : '0';
                let url = `/api/unlinked_items?page=${currentPage}&limit=${pageSize}&search=${encodeURIComponent(searchVal)}&category3=${encodeURIComponent(categoryVal)}&sort_store_id=${encodeURIComponent(sortStoreIdForApi)}&sort_order=${encodeURIComponent(sortOrder)}`;
                url += `&filters=${encodeURIComponent(JSON.stringify(filtersPayload))}&negative_sales=${neg}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                gridData = data.items || [];
                filteredData = gridData;
                totalItems = data.total || 0;
                totalPages = data.pages || 0;
                spuCount = data.spu_count || 0;
                skuCount = data.sku_count ?? totalItems;
                storeStats = data.store_stats || {};
                spuEliminatedCount = data.spu_eliminated_count || 0;
                skuEliminatedCount = data.sku_eliminated_count || 0;
                if (loadingMsg) loadingMsg.style.display = 'none';
                extractHeaders();
                renderGrid(false);
                renderPagination(totalItems, totalPages);
                renderFilterPopup();
            } catch (e) {
                console.error("Failed to load unlinked data:", e);
                if (loadingMsg) {
                    loadingMsg.style.color = "red";
                    loadingMsg.innerText = `未匹配数据加载失败: ${e.message}`;
                }
            }
        }

        function saveColumnSettings() {
            console.log("Saving column settings:", allBaseColumns, visibleColumns);
            localStorage.setItem('pro_image_all_columns', JSON.stringify(allBaseColumns));
            localStorage.setItem('pro_image_visible_columns', JSON.stringify(visibleColumns));
        }

        function loadColumnSettings() {
            try {
                const savedAll = JSON.parse(localStorage.getItem('pro_image_all_columns'));
                const savedVisible = JSON.parse(localStorage.getItem('pro_image_visible_columns'));
                console.log("Loaded column settings:", savedAll, savedVisible);
                return { savedAll, savedVisible };
            } catch (e) {
                console.error("Failed to load column settings:", e);
                return { savedAll: null, savedVisible: null };
            }
        }

        /* 
         * --- 字段提取与表头管理 ---
         * 从原始数据中提取所有可能的 Key，并根据优先级或缓存进行排序
         */
        function extractHeaders() {
            if (gridData.length === 0) return;
            const allKeys = new Set();
            const internalKeys = ['淘汰标记', '是否淘汰', '__idx', '相似度', '匹配', '是否新增', '是否不处理', 'is_ignored', '跟价店'];

            gridData.forEach(row => {
                Object.keys(row).forEach(key => {
                    const baseKey = key.replace(/^\d+/, '');
                    if (!internalKeys.includes(baseKey) && !internalKeys.includes(key)) {
                        allKeys.add(baseKey);
                    }
                });
            });

            // Inject Gross Margin fields if 采购价 exists
            if (allKeys.has('采购价')) {
                allKeys.add('现价毛利');
                allKeys.add('跟价毛利');
            }

            const currentKeys = Array.from(allKeys);
            const { savedAll, savedVisible } = loadColumnSettings();

            // Determine the order of allBaseColumns
            if (savedAll && Array.isArray(savedAll)) {
                // Use saved order for existing keys, append new keys
                const ordered = savedAll.filter(k => currentKeys.includes(k));
                const newKeys = currentKeys.filter(k => !savedAll.includes(k));
                allBaseColumns = [...ordered, ...newKeys];
            } else {
                // Default priority sort
                allBaseColumns = currentKeys;
                const priority = ['条码', '商品名称', '规格', '品牌', '采购价', '跟价毛利', '现价毛利', '活动价', '原价', '销售'];
                allBaseColumns.sort((a, b) => {
                    const idxA = priority.indexOf(a);
                    const idxB = priority.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });
            }

            // Determine visibleColumns
            const defaultVisible = [
                "商品条码", "商品名称", "规格名称", "跟价毛利", "现价毛利", "采购价",
                "活动价", "美团类目三级", "skuId", "主图链接", "原价", "销售"
            ];

            if (savedVisible && Array.isArray(savedVisible)) {
                // Use saved visibility for existing keys, ignore obsolete ones
                visibleColumns = savedVisible
                    .filter(k => k === '主图链接' || currentKeys.includes(k));
            } else {
                // First time initialization
                if (visibleColumns.length === 0) {
                    visibleColumns = defaultVisible.filter(k => k === '主图链接' || allBaseColumns.includes(k));
                } else {
                    // Keep existing logic if visibleColumns isn't empty but savedVisible is missing
                }
            }
            console.log("Effective columns after extractHeaders:", allBaseColumns, visibleColumns);
        }


        /* 
         * --- 数据过滤引擎 ---
         * 整合全局搜索、高级筛选和排序逻辑，生成 filteredData
         */
        function filterData(resetPage = true) {
            if (isUnlinkedMode) {
                loadUnlinkedData(resetPage);
            } else {
                loadData(resetPage);
            }
        }

        function syncUnlinkedToggleButton() {
            const btn = document.getElementById('unlinkedToggleBtn');
            const txt = document.getElementById('unlinkedBtnText');
            if (!btn || !txt) return;
            btn.classList.toggle('active', isUnlinkedMode);
            txt.textContent = isUnlinkedMode ? '关联数据' : '未关联数据';
        }

        async function openWorkbenchForCategory(category) {
            const category3 = String(category || '').trim();
            if (!category3) return;

            advancedFilters['美团类目三级'] = category3;
            showNoLinkOnly = false;
            showUnhandledOnly = false;
            currentFilterMode = 'all';
            isUnlinkedMode = false;
            syncUnlinkedToggleButton();

            try {
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                if (!config.has_links) {
                    if (typeof window.openWorkbenchAnalyzeModal === 'function') {
                        window.openWorkbenchAnalyzeModal();
                        return;
                    }
                    alert('当前项目还没有关联数据，请先进行分析');
                    return;
                }
            } catch (err) {
                alert(err?.message || '无法校验关联数据');
                return;
            }

            const wasLoaded = !!window.__workbenchLoaded;
            if (window.showPanel) window.showPanel('projects');
            if (wasLoaded) {
                filterData(true);
            } else {
                renderFilterPopup();
            }
        }

        function setSort(field, order) {
            if (currentSort.field === field && currentSort.order === order) {
                currentSort = { field: null, order: null };
            } else {
                currentSort = { field: field, order: order };
            }
            renderFilterPopup();
            filterData();
        }

        let fieldSearchTerm = "";

        function renderFilterPopup() {
            const popup = document.getElementById('filterPopup');
            const currentDisplay = popup.style.display || window.getComputedStyle(popup).display;
            if (!popup || currentDisplay === 'none') return;

            popup.style.display = 'flex'; // Ensure flex for the layout

            popup.innerHTML = `
        <div style="margin-bottom: 12px;">
            <input type="text" class="search-box" id="fieldSearch" placeholder="搜索字段名称..." 
                   style="margin-bottom: 12px;" value="${fieldSearchTerm}" oninput="handleFieldSearch(this.value)">
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex: 1; font-size: 11px; padding: 4px;" onclick="toggleAllColumns(true)">全选</button>

        let draggedIndex = null;
        function handleDragStart(e) {
            const item = e.target.closest('.filter-item');
            draggedIndex = parseInt(item.dataset.index);
            item.classList.add('dragging');
        }
        function handleDragOver(e) { e.preventDefault(); }
        function handleDragEnter(e) {
            const item = e.target.closest('.filter-item');
            if (item && parseInt(item.dataset.index) !== draggedIndex) {
                item.style.borderTop = '2px solid var(--primary-color)';
            }
        }
        function handleDragLeave(e) {
            const item = e.target.closest('.filter-item');
            if (item) item.style.borderTop = '';
        }
        function handleDragEnd(e) {
            document.querySelectorAll('.filter-item').forEach(it => {
                it.classList.remove('dragging');
                it.style.borderTop = '';
            });
        }
        function handleDrop(e) {
            e.preventDefault();
            const item = e.target.closest('.filter-item');
            if (!item) return;
            const targetIndex = parseInt(item.dataset.index);
            if (draggedIndex === null || draggedIndex === targetIndex) return;

            const movingCol = allBaseColumns.splice(draggedIndex, 1)[0];
            allBaseColumns.splice(targetIndex, 0, movingCol);
            visibleColumns.sort((a, b) => allBaseColumns.indexOf(a) - allBaseColumns.indexOf(b));

            saveColumnSettings();
            renderFilterPopup();
            filterData();
        }

        const _debouncedFilter = debounce(() => filterData(), 800);
        function updateAdvancedFilter(field, val) {
            advancedFilters[field] = val;
            _debouncedFilter();
        }

        function toggleColumn(col) {
            if (visibleColumns.includes(col)) {
                visibleColumns = visibleColumns.filter(c => c !== col);
            } else {
                visibleColumns.push(col);
                visibleColumns.sort((a, b) => allBaseColumns.indexOf(a) - allBaseColumns.indexOf(b));
            }
            saveColumnSettings();
            renderGrid();

        const MATCH_METRIC_LABELS = {
            core_conflict: '高风险冲突',

        function explainValueText(value) {
            if (Array.isArray(value)) return value.filter(Boolean).join('、') || '-';
            if (value && typeof value === 'object') {
                return Object.entries(value)
                    .filter(([, v]) => v !== '' && v !== null && v !== undefined && !(Array.isArray(v) && !v.length))
                    .map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join('、') : v}`)
                    .join('；') || '-';
            }
            return String(value ?? '').trim() || '-';
        }

        function renderMetricValues(values) {
            if (!values || typeof values !== 'object') return '';
            const main = values.main ?? values.main_norm ?? '';
            const cand = values.candidate ?? values.candidate_norm ?? '';
            const extra = Object.entries(values)
                .filter(([k]) => !['main', 'candidate', 'main_norm', 'candidate_norm'].includes(k))
                .filter(([, v]) => v !== '' && v !== null && v !== undefined && !(Array.isArray(v) && !v.length))
                .map(([k, v]) => `${k}: ${explainValueText(v)}`)
                .join('；');
            const bits = [];
            if (main || cand) bits.push(`主: ${explainValueText(main)} ｜ 竞: ${explainValueText(cand)}`);
            if (extra) bits.push(extra);
            return bits.length ? `<div class="explain-detail" style="margin-top:4px;">${escHtml(bits.join('；'))}</div>` : '';
        }

        function renderStrongMetrics(metrics) {
            const rows = (metrics || []).map(m => {
                const stateClass = !m.enabled ? 'off' : (m.passed ? 'pass' : 'fail');
                const stateText = !m.enabled ? '未启用' : (m.passed ? '通过' : '拦截');
                return `
                    <div class="explain-metric">
                        <div class="explain-value">${escHtml(MATCH_METRIC_LABELS[m.key] || m.key)}</div>
                        <div><span class="explain-pill ${stateClass}">${stateText}</span></div>
                        <div class="explain-detail">
                            ${escHtml(m.reason || '')}
                            ${renderMetricValues(m.values)}
                        </div>
                    </div>`;
            }).join('');
            return rows || '<div class="explain-detail">无后验规则解释</div>';
        }

        function renderWeakMetrics(weak) {
            const details = weak?.details || {};
            const rows = Object.entries(details).map(([key, item]) => {
                const bonus = Number(item.bonus || 0);
                const matched = Array.isArray(item.matched) ? item.matched : (item.matched ? ['一致'] : []);
                const main = explainValueText(item.main);
                const cand = explainValueText(item.candidate);
                const hit = explainValueText(matched);
                return `
                    <div class="explain-metric">
                        <div class="explain-value">${escHtml(MATCH_METRIC_LABELS[key] || key)}</div>
                        <div><span class="explain-pill weak">+${bonus.toFixed(3)}</span></div>
                        <div class="explain-detail">${escHtml(`主: ${main} ｜ 竞: ${cand} ｜ 命中: ${hit}`)}</div>
                    </div>`;
            }).join('');
            return rows || '<div class="explain-detail">无弱排序信号</div>';
        }

        function renderOtherCandidates(candidates) {
            const list = Array.isArray(candidates) ? candidates : [];
            if (!list.length) return '<div class="explain-detail">暂无其他候选商品解释</div>';
            return list.map(c => {
                const post = c.post_match || {};
                const weak = c.weak_ranking || {};
                const accepted = !!c.accepted;
                const pillClass = accepted ? 'skip' : 'fail';
                const pillText = accepted ? '放过未选' : '规则拦截';
                const textScore = Number(c.text_similarity || 0);
                const weakBonus = Number(c.weak_bonus || weak.bonus || 0);
                const spec = c.规格名称 ? ` ｜ ${c.规格名称}` : '';
                return `
                    <div class="explain-candidate">
                        <div class="explain-candidate-head">
                            <div>
                                <div class="explain-candidate-name">${escHtml(c.商品名称 || '-')}</div>
                                <div class="explain-candidate-meta">SKU: ${escHtml(c.skuId || '-')}${escHtml(spec)}</div>
                                <div class="explain-detail" style="margin-top:6px;">${escHtml(c.summary || post.reason || '')}</div>
                            </div>
                            <div><span class="explain-pill ${pillClass}">${pillText}</span></div>
                        </div>
                        <div class="explain-candidate-meta">文本近似 ${(textScore * 100).toFixed(0)}% ｜ 弱排序 +${weakBonus.toFixed(3)}</div>
                        <details>
                            <summary>查看这个商品的规则明细</summary>
                            <div style="margin-top:8px;">
                                ${renderStrongMetrics(post.metrics || [])}
                            </div>
                        </details>
                    </div>`;
            }).join('');
        }

                const post = data.post_match || {};
                const weak = data.weak_ranking || {};

                        </div>
                        <div class="explain-summary-item">
                            <div class="explain-label">关联方式</div>

                        </div>
                        <div class="explain-summary-item">
                            <div class="explain-label">弱排序加分</div>

                        </div>
                    </div>
                    <div class="explain-section">
                        <div class="explain-section-title">后验规则结果：${post.accepted ? '放过' : '拦截'} · ${escHtml(post.reason || '')}</div>

                    <div class="explain-section">

                        ${renderOtherCandidates(data.other_candidates || [])}
                    </div>
                    <div class="explain-section">
                        <div class="explain-section-title">商品对照</div>
                        <div class="explain-detail">${escHtml(data.main?.商品名称 || '')}</div>
                        <div class="explain-detail" style="margin-top:6px;">${escHtml(data.candidate?.商品名称 || '')}</div>
                    </div>`;
            } catch (err) {
                body.innerHTML = `<div class="explain-section" style="color:#b91c1c;font-weight:800;">${escHtml(err.message || '解释加载失败')}</div>`;
            }

        function decodeCopyPayload(b64) {
            if (!b64) return '';
            try {

        function showCopyToast(message) {
            let el = document.getElementById('copyToast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'copyToast';
                el.setAttribute('role', 'status');
                el.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#1e293b;color:#fff;border-radius:10px;font-size:14px;font-weight:600;z-index:100000;box-shadow:0 8px 32px rgba(0,0,0,0.25);opacity:0;transition:opacity .2s ease;pointer-events:none;max-width:90vw;text-align:center;';
                document.body.appendChild(el);

            el.textContent = message;

            showCopyToast._t = setTimeout(() => {
                el.style.opacity = '0';
            }, 2200);

        async function copyFieldValueToClipboard(text) {
            const t = text == null ? '' : String(text);
            let ok = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(t);
                    ok = true;
                } else {
                    throw new Error('clipboard unavailable');
                }
            } catch (err) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = t;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    ta.style.top = '0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, t.length);
                    ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                } catch (e2) {
                    ok = false;
                }
            }
            showCopyToast(ok ? '已复制到剪贴板' : '复制失败，请手动选中复制');
        }

        function _eventTargetElement(ev) {
            const t = ev.target;
            if (t instanceof Element) return t;
            if (t && t.parentNode instanceof Element) return t.parentNode;
            return null;
        }

        function setupCopyFieldDelegation() {
            const grid = document.getElementById('gridBody');
            if (!grid || grid._copyDelegationBound) return;
            grid._copyDelegationBound = true;
            grid.addEventListener('click', (ev) => {
                const t = _eventTargetElement(ev);
                if (!t) return;
                if (t.closest('button, .ref-icon-btn, .action-btn, .ref-tag-close, input, .editable-price')) return;
                if (t.closest('label') && t.closest('.card-actions')) return;
                const el = t.closest('.copyable-field-value');
                if (!el || !grid.contains(el)) return;
                const b64 = el.getAttribute('data-copy-b64');
                if (b64 === null || b64 === '') return;
                ev.preventDefault();
                ev.stopPropagation();
                copyFieldValueToClipboard(decodeCopyPayload(b64));
            });
            grid.addEventListener('keydown', (ev) => {
                if (ev.key !== 'Enter' && ev.key !== ' ') return;
                const t = _eventTargetElement(ev);
                if (!t) return;
                const el = t.closest('.copyable-field-value');
                if (!el || !grid.contains(el)) return;
                const b64 = el.getAttribute('data-copy-b64');
                if (b64 === null || b64 === '') return;
                ev.preventDefault();
                ev.stopPropagation();
                copyFieldValueToClipboard(decodeCopyPayload(b64));
            });
        }

        function setupModalCopyDelegation() {
            const modal = document.getElementById('linkModal');
            if (!modal || modal._copyDelegationBound) return;
            modal._copyDelegationBound = true;
            const tryCopy = (ev) => {
                const t = _eventTargetElement(ev);
                if (!t) return false;
                const el = t.closest('.copyable-field-value');
                if (!el || !modal.contains(el)) return false;
                const b64 = el.getAttribute('data-copy-b64');
                if (b64 === null || b64 === '') return false;
                ev.preventDefault();
                ev.stopPropagation();
                copyFieldValueToClipboard(decodeCopyPayload(b64));
                return true;
            };
            modal.addEventListener('click', tryCopy);
            modal.addEventListener('dblclick', (ev) => {
                const t = _eventTargetElement(ev);
                if (t && t.closest('.copyable-field-value')) {
                    ev.preventDefault();
                    ev.stopPropagation();
                }
            });
            modal.addEventListener('keydown', (ev) => {
                if (ev.key !== 'Enter' && ev.key !== ' ') return;
                tryCopy(ev);
            });
        }

        function getRowBySku(skuId) {
            if (!skuId) return null;
            return gridData.find(r => String(r.skuId) === String(skuId)) || null;
        }

        /** 本行在「已关联赛店」中销量取最大值，用于标出谁是最高的（可并列） */
        function getRowMaxCompSalesAmongLinked(row) {
            if (!row || !storeSources || !storeSources.length) return { max: null, storeIds: [] };
            let max = -Infinity;
            const atMax = [];
            storeSources.forEach(s => {
                if (!row[s.id + 'skuId']) return;
                const cs = parseFloat(row[s.id + '销售']) || 0;
                if (cs > max) {
                    max = cs;
                    atMax.length = 0;
                    atMax.push(String(s.id));
                } else if (Math.abs(cs - max) < 1e-9) {
                    atMax.push(String(s.id));
                }
            });
            if (max === -Infinity) return { max: null, storeIds: [] };
            return { max, storeIds: atMax };
        }

        function isEliminatedRow(row) {
            return String(row?.['淘汰标记'] ?? '') === '1' || String(row?.['是否淘汰'] ?? '') === '是';
        }

        function formatCountWithEliminated(count, eliminatedCount) {
            const n = Number(count) || 0;
            const e = Number(eliminatedCount) || 0;
            return e > 0 ? `${n}-${e}` : `${n}`;
        }

        function renderPagination(totalItems, totalPages) {
            const paginEl = document.getElementById('pagination');
            if (!paginEl || totalItems === 0) {
                if (paginEl) paginEl.innerHTML = '';
                return;
            }

            let pagesHtml = '';
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            if (endPage - startPage + 1 < maxVisiblePages) startPage = Math.max(1, endPage - maxVisiblePages + 1);

            for (let i = startPage; i <= endPage; i++) {
                pagesHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            paginEl.innerHTML = `
                <div class="pagination-info">
                    <span style="font-weight: bold;">spu : ${formatCountWithEliminated(spuCount, spuEliminatedCount)}</span>
                    <span style="margin-left: 16px; font-weight: bold;">sku : ${formatCountWithEliminated(skuCount, skuEliminatedCount)}</span>
                </div>
                <div class="pagination-controls">
                    <select class="page-size-selector" onchange="changePageSize(parseInt(this.value))">
                        ${[10, 20, 50, 100].map(s => `<option value="${s}" ${pageSize === s ? 'selected' : ''}>${s} 条/页</option>`).join('')}
                    </select>
                    <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">上一页</button>
                    ${pagesHtml}
                    <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一页</button>
                    <div class="page-jump-wrap">
                        <span class="page-jump-label">跳至</span>
                        <input type="number" class="page-jump-input" min="1" max="${totalPages}" value="${currentPage}"
                            onkeydown="if(event.key==='Enter') jumpToPage(this.value, ${totalPages})">
                        <span class="page-jump-label">页</span>
                    </div>
                </div>
            `;
        }

        function changePage(page) {
            currentPage = page;
            filterData(false);
        }

        function changePageSize(size) {
            pageSize = parseInt(size);
            currentPage = 1;
            filterData(true);
        }

        function jumpToPage(page, totalPages) {
            let p = parseInt(page);
            if (isNaN(p) || p < 1) p = 1;
            if (p > totalPages) p = totalPages;
            changePage(p);
        }

        function getStoreColor(storeId) {
            if (storeId === null) return 'var(--card-main-bg)';

            const colors = [
                'hsla(45, 100%, 88%, 1)',  // Amber/Yellow
                'hsla(145, 80%, 88%, 1)',  // Emerald Green
                'hsla(210, 90%, 90%, 1)',  // Sky Blue
                'hsla(265, 85%, 92%, 1)',  // Electric Violet
                'hsla(335, 90%, 92%, 1)',  // Rose Pink
                'hsla(25, 100%, 89%, 1)'   // Sunset Orange
            ];
            const idx = parseInt(storeId) % colors.length;
            return colors[idx] || 'rgba(0,0,0,0.05)';
        }

            const compAddMarked = !isMain && (row[`${prefix}是否新增`] === '是' || row[`${prefix}是否新增`] === '新增为SPU' || row[`${prefix}是否新增`] === '新增该规格');

            let linkedBadgeHtml = '';

                const linkedCount = parseInt(row['__linked_count'] || 0);
