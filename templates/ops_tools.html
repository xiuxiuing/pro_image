<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营工具</title>
    <style>
        :root {
            --ink: #111827;
            --muted: #64748b;
            --line: #dbe3ef;
            --blue: #4f46e5;
            --green: #059669;
            --red: #dc2626;
            --panel: #ffffff;
            --bg: #f5f7fb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
        }
        header {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
        header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
        main {
            width: min(1320px, calc(100vw - 48px));
            margin: 28px auto 56px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }
        section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
        }
        h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: 0; }
        .hint { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 22px; }
        .field { margin-bottom: 18px; }
        label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            min-height: 42px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 9px 12px;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }
        input[type="file"] { padding: 8px; }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 22px;
        }
        button, .download-link {
            border: 0;
            border-radius: 8px;
            min-height: 42px;
            padding: 0 18px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        button.primary { background: var(--blue); color: #fff; }
        button.secondary { background: #e8eef8; color: #334155; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .download-link { background: var(--green); color: #fff; }
        .progress {
            margin-top: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        .progress-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: #f8fafc;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }
        .steps { padding: 10px 14px; }
        .step {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 10px;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid #eef2f7;
        }
        .step:last-child { border-bottom: 0; }
        .badge {
            display: inline-flex;
            width: fit-content;
            min-width: 68px;
            justify-content: center;
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 800;
        }
        .pending { background: #eef2f7; color: #475569; }
        .running { background: #e0e7ff; color: #3730a3; }
        .done { background: #dcfce7; color: #166534; }
        .failed { background: #fee2e2; color: #991b1b; }
        .message {
            margin-top: 14px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }
        .message.error { color: var(--red); font-weight: 700; }
        .inline-note {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; width: min(720px, calc(100vw - 28px)); }
            header { padding: 0 18px; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>运营工具</h1>
        </div>
        <a class="download-link" href="/" style="background:#111827;">返回项目页</a>
    </header>

    <main>
        <section>
            <h2>A* 数据提取</h2>
            <p class="hint">上传主竞店原始文件，复用现有 Gemini / Kimi / 本地规则兜底提取链路，生成带 A* 字段的文件包。</p>
            <form id="astar-form">
                <div class="field">
                    <label>主店文件</label>
                    <input type="file" name="main_file" accept=".xlsx,.xls" required>
                </div>
                <div class="field">
                    <label>竞店文件</label>
                    <input type="file" name="comp_files" accept=".xlsx,.xls" multiple required>
                </div>
                <div class="row">
                    <div class="field">
                        <label>Gemini 模型</label>
                        <select name="ai_model_name">
                            <option value="" selected>默认</option>
                            <option value="models/gemini-3.1-flash-lite-preview">models/gemini-3.1-flash-lite-preview</option>
                            <option value="gemini-3.1-flash-lite-preview">gemini-3.1-flash-lite-preview</option>
                            <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Gemini API Key</label>
                        <input type="password" name="api_key" required placeholder="输入 Gemini API Key">
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        <label>Kimi 模型（可选）</label>
                        <select name="kimi_model_name">
                            <option value="" selected>默认</option>
                            <option value="kimi-k2.5">kimi-k2.5</option>
                            <option value="kimi-k2-turbo-preview">kimi-k2-turbo-preview</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Kimi API Key（可选）</label>
                        <input type="password" name="kimi_api_key" placeholder="留空则最终走本地规则兜底">
                    </div>
                </div>
                <div class="actions">
                    <button class="primary" type="submit" id="astar-submit">开始提取</button>
                    <a id="astar-download" class="download-link" style="display:none;">下载 A* ZIP</a>
                    <button class="secondary" type="button" id="use-astar-task" style="display:none;">用本次结果生成 Output</button>
                </div>
            </form>
            <div class="progress" id="astar-progress">
                <div class="progress-head"><span id="astar-status">等待中</span><span id="astar-task-id"></span></div>
                <div class="steps" id="astar-steps"></div>
            </div>
            <div class="message" id="astar-message"></div>
        </section>

        <section>
            <h2>Output 文件生成</h2>
            <p class="hint">上传带 A* 的主竞店文件，或直接使用左侧刚生成的 A* 文件，复用现有向量匹配和类目规则模板生成 output。</p>
            <form id="output-form">
                <input type="hidden" name="astar_task_id" id="output-astar-task-id">
                <input type="hidden" name="use_astar_task" id="output-use-astar-task" value="0">
                <div class="field">
                    <label>输入来源</label>
                    <select id="output-source-mode">
                        <option value="upload" selected>手动上传 A* 文件</option>
                        <option value="task">使用上一步 A* 结果</option>
                    </select>
                    <div class="inline-note" id="task-source-note">上一步任务完成后可选择。</div>
                </div>
                <div id="output-upload-fields">
                    <div class="field">
                        <label>主店 A* 文件</label>
                        <input type="file" name="main_file" accept=".xlsx,.xls">
                    </div>
                    <div class="field">
                        <label>竞店 A* 文件</label>
                        <input type="file" name="comp_files" accept=".xlsx,.xls" multiple>
                    </div>
                </div>
                <div class="field">
                    <label>类目规则模板</label>
                    <select name="rule_template_id" id="rule-template-select">
                        <option value="">加载中</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="primary" type="submit" id="output-submit">生成匹配文件</button>
                    <a id="output-download" class="download-link" style="display:none;">下载 Output</a>
                </div>
            </form>
            <div class="progress" id="output-progress">
                <div class="progress-head"><span id="output-status">等待中</span><span id="output-task-id"></span></div>
                <div class="steps" id="output-steps"></div>
            </div>
            <div class="message" id="output-message"></div>
        </section>
    </main>

    <script>
        let lastAstarTaskId = "";
        const pollers = {};

        function setMessage(id, text, isError = false) {
            const el = document.getElementById(id);
            el.textContent = text || "";
            el.classList.toggle("error", !!isError);
        }

        function renderSteps(containerId, steps) {
            const box = document.getElementById(containerId);
            box.innerHTML = "";
            (steps || []).forEach(step => {
                const row = document.createElement("div");
                row.className = "step";
                const badge = document.createElement("span");
                badge.className = "badge " + (step.status || "pending");
                badge.textContent = {
                    pending: "等待",
                    running: "运行中",
                    done: "完成",
                    failed: "失败"
                }[step.status] || step.status || "等待";
                const text = document.createElement("div");
                text.textContent = step.label + (step.detail ? " · " + step.detail : "");
                row.appendChild(badge);
                row.appendChild(text);
                box.appendChild(row);
            });
        }

        async function loadRuleTemplates() {
            const select = document.getElementById("rule-template-select");
            const resp = await fetch("/api/rule-templates");
            const data = await resp.json();
            if (data.status !== "ok") {
                select.innerHTML = "<option value=''>加载失败</option>";
                return;
            }
            const items = data.items || [];
            select.innerHTML = "";
            items.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.id;
                opt.textContent = item.name;
                if (item.name === "生产规则V1") opt.selected = true;
                select.appendChild(opt);
            });
            if (!select.value && items[0]) select.value = items[0].id;
        }

        async function pollTask(taskId, kind) {
            const progressEl = document.getElementById(kind + "-progress");
            const statusEl = document.getElementById(kind + "-status");
            const taskEl = document.getElementById(kind + "-task-id");
            const messageId = kind + "-message";
            progressEl.style.display = "block";
            taskEl.textContent = taskId;
            const resp = await fetch(`/api/ops/tasks/${taskId}/progress?t=${Date.now()}`);
            const data = await resp.json();
            if (data.status !== "ok") {
                setMessage(messageId, data.message || "任务查询失败", true);
                clearInterval(pollers[kind]);
                return;
            }
            const task = data.task;
            statusEl.textContent = task.message || task.status;
            renderSteps(kind + "-steps", task.steps);
            if (task.status === "done") {
                clearInterval(pollers[kind]);
                const link = document.getElementById(kind + "-download");
                link.href = `/api/ops/tasks/${taskId}/download`;
                link.style.display = "inline-flex";
                setMessage(messageId, "任务完成，可以下载结果。");
                if (kind === "astar") {
                    lastAstarTaskId = taskId;
                    document.getElementById("use-astar-task").style.display = "inline-flex";
                    document.getElementById("output-astar-task-id").value = taskId;
                    document.getElementById("task-source-note").textContent = `可使用任务 ${taskId} 的 A* 文件生成 Output。`;
                }
            } else if (task.status === "failed") {
                clearInterval(pollers[kind]);
                setMessage(messageId, task.error || "任务失败", true);
            }
        }

        function startPolling(taskId, kind) {
            clearInterval(pollers[kind]);
            pollTask(taskId, kind);
            pollers[kind] = setInterval(() => pollTask(taskId, kind), 2500);
        }

        document.getElementById("astar-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const btn = document.getElementById("astar-submit");
            btn.disabled = true;
            document.getElementById("astar-download").style.display = "none";
            document.getElementById("use-astar-task").style.display = "none";
            setMessage("astar-message", "已提交，后台开始处理。");
            try {
                const resp = await fetch("/api/ops/astar-extract", { method: "POST", body: new FormData(event.target) });
                const data = await resp.json();
                if (data.status !== "ok") throw new Error(data.message || "提交失败");
                startPolling(data.task_id, "astar");
            } catch (err) {
                setMessage("astar-message", err.message, true);
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById("use-astar-task").addEventListener("click", () => {
            if (!lastAstarTaskId) return;
            document.getElementById("output-source-mode").value = "task";
            document.getElementById("output-astar-task-id").value = lastAstarTaskId;
            document.getElementById("output-use-astar-task").value = "1";
            document.getElementById("output-upload-fields").style.display = "none";
            setMessage("output-message", `已选择 A* 任务 ${lastAstarTaskId} 作为输入。`);
        });

        document.getElementById("output-source-mode").addEventListener("change", (event) => {
            const useTask = event.target.value === "task";
            document.getElementById("output-use-astar-task").value = useTask ? "1" : "0";
            document.getElementById("output-astar-task-id").value = useTask ? lastAstarTaskId : "";
            document.getElementById("output-upload-fields").style.display = useTask ? "none" : "block";
        });

        document.getElementById("output-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const btn = document.getElementById("output-submit");
            const useTask = document.getElementById("output-use-astar-task").value === "1";
            if (useTask && !document.getElementById("output-astar-task-id").value) {
                setMessage("output-message", "还没有可用的 A* 任务结果。", true);
                return;
            }
            btn.disabled = true;
            document.getElementById("output-download").style.display = "none";
            setMessage("output-message", "已提交，后台开始处理。");
            try {
                const resp = await fetch("/api/ops/output-generate", { method: "POST", body: new FormData(event.target) });
                const data = await resp.json();
                if (data.status !== "ok") throw new Error(data.message || "提交失败");
                startPolling(data.task_id, "output");
            } catch (err) {
                setMessage("output-message", err.message, true);
            } finally {
                btn.disabled = false;
            }
        });

        loadRuleTemplates();
    </script>
</body>
</html>
